<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>autoControl Backend</title>
<style>
:root{--bg:#eef3f8;--panel:#fff;--line:#dbe4ef;--text:#0f172a;--muted:#64748b;--nav:#0f172a;--nav2:#1e293b;--primary:#0891b2;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI","Microsoft JhengHei",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:var(--nav);color:#cbd5e1;padding:14px 10px}.brand{font-size:19px;font-weight:900;color:#fff;padding:8px 10px 14px;border-bottom:1px solid #334155;margin-bottom:8px}
.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:8px;font-weight:900}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}
.main{min-width:0}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:13px}.content{padding:16px}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{min-width:160px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:900;margin-bottom:4px}input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;color:var(--text)}
.btn{border:0;border-radius:8px;padding:8px 12px;font-weight:900;min-height:38px;background:#e2e8f0;color:var(--text)}.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.primary{background:var(--primary);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.orange{background:var(--orange);color:#fff}.btn.blue{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.metric b{display:block;font-size:28px;line-height:1}.metric span{display:block;color:var(--muted);margin-top:5px;font-weight:800}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}.panel-h{padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.panel-h h2{margin:0;font-size:18px}.panel-b{padding:12px 14px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f8fafc;color:#475569;font-size:12px;font-weight:900;white-space:nowrap}td.actions{white-space:nowrap}.muted{color:var(--muted)}.mono{font-family:Consolas,monospace}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;white-space:nowrap;margin:1px 2px 1px 0}.pill.ok{background:#dcfce7;color:#166534}.pill.off{background:#e2e8f0;color:#475569}.pill.err{background:#fee2e2;color:#991b1b}.pill.warn{background:#fef3c7;color:#92400e}.pill.info{background:#dbeafe;color:#1e40af}.pill.pending{background:#e0e7ff;color:#3730a3}
.node{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}.node-head{padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.node-title{font-size:18px;font-weight:900}.node-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.relay-grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.relay{border:1px solid var(--line);border-left:4px solid #cbd5e1;border-radius:12px;background:#fff;padding:14px;min-height:208px;display:flex;flex-direction:column;gap:8px}.relay.on{border-left-color:var(--green);background:#f0fdf4}.relay.locked{border-left-color:var(--red);background:#fff1f2}.relay.pending{background:#f8fafc;opacity:.76;filter:saturate(.7)}.relay h3{margin:0;font-size:17px;word-break:break-word}.relay .state{font-weight:900}.relay .adc{font-weight:800;color:var(--muted)}.relay-actions{margin-top:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.relay-actions .main{min-width:86px}.relay-actions .right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.empty{padding:28px;text-align:center;color:var(--muted);font-weight:900}pre{margin:0;background:#0f172a;color:#dbeafe;border-radius:10px;padding:12px;overflow:auto;max-height:460px}.toast{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;flex-direction:column;gap:8px}.toast div{background:#0f172a;color:#fff;border-radius:8px;padding:9px 12px;font-weight:900;box-shadow:0 6px 20px rgba(15,23,42,.25)}.toast div.bad{background:var(--red)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 18px 45px rgba(15,23,42,.12)}.login-card h1{margin:0 0 8px;font-size:24px}.login-card p{margin:0 0 18px;color:var(--muted);font-weight:800}.login-card .field{margin-bottom:12px}.claim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:18px}.modal-card{width:min(560px,100%);background:#fff;border-radius:12px;border:1px solid var(--line);padding:18px;box-shadow:0 18px 50px rgba(15,23,42,.22)}.modal-card h2{margin:0 0 12px;font-size:20px}.radio-list{display:grid;gap:10px;margin:12px 0}.radio-list label{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:9px 10px}.radio-list span{display:block}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:860px){body{font-size:16px}.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;gap:6px;overflow:auto}.nav button{white-space:nowrap}.content{padding:10px}.relay-grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}table{min-width:680px}.relay-actions{align-items:stretch}.relay-actions .main{flex:1 1 100%}.relay-actions .right{margin-left:0;width:100%}.relay-actions .right .btn{flex:1 1 0}.top{position:static;align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="login" id="loginView">
  <form class="login-card" id="loginForm">
    <h1>autoControl 後端管理台</h1>
    <p>預設帳密：admin123 / admin123</p>
    <div class="field"><label>使用者名稱</label><input id="loginUser" autocomplete="username" value="admin123"></div>
    <div class="field"><label>密碼</label><input id="loginPass" type="password" autocomplete="current-password" value="admin123"></div>
    <button class="btn primary" type="submit" style="width:100%">登入</button>
  </form>
</div>
<div class="app hidden" id="appView">
  <aside class="side"><div class="brand">autoControl Backend</div><nav class="nav" id="nav"></nav></aside>
  <main class="main">
    <header class="top"><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="top-actions"><div class="sub" id="clock">--</div><button class="btn" onclick="logout()">登出</button></div></header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal hidden" id="pauseModal">
  <div class="modal-card">
    <h2 id="pauseTitle">暫停排程</h2>
    <div class="muted">手動控制前需要先暫停此路排程，避免排程立刻把 relay 改回原狀。</div>
    <div class="radio-list">
      <label><input type="radio" name="pauseMode" value="segment" checked><span><b>暫停到目前排程區間結束後 1 分鐘</b><span class="muted">適合臨時手動控制。</span></span></label>
      <label><input type="radio" name="pauseMode" value="1hr"><span><b>暫停 1 小時</b></span></label>
      <label><input type="radio" name="pauseMode" value="1day"><span><b>暫停 1 天</b></span></label>
      <label><input type="radio" name="pauseMode" value="custom"><span><b>暫停到指定時間</b><input id="pauseCustom" type="datetime-local" style="margin-top:6px"></span></label>
      <label><input type="radio" name="pauseMode" value="disable"><span><b>停用排程</b><span class="muted">只停用此路排程，不清除一週設定。</span></span></label>
    </div>
    <label><input type="checkbox" id="pauseBlockAuto"> 同時阻擋 Auto Hold 自動觸發</label>
    <div class="modal-actions"><button class="btn" onclick="resolvePauseModal(false)">取消</button><button class="btn primary" onclick="resolvePauseModal(true)">套用並控制</button></div>
  </div>
</div>
<div class="modal hidden" id="relayConfigModal">
  <div class="modal-card">
    <h2 id="relayConfigTitle">Relay 設定</h2>
    <div class="split">
      <div class="field"><label>名稱</label><input id="cfgName"></div>
      <div class="field"><label>保護策略</label><select id="cfgStrategy"><option value="0">安全優先</option><option value="1">連續優先</option><option value="2">手動保護</option></select></div>
      <label><input id="cfgEnabled" type="checkbox"> 啟用</label>
      <label><input id="cfgRemember" type="checkbox"> 記憶狀態</label>
      <label><input id="cfgBoot" type="checkbox"> 開機預設開</label>
      <label><input id="cfgProtection" type="checkbox"> 啟用電流保護策略</label>
      <div class="field"><label>過流門檻 (mA)</label><input id="cfgLimit" type="number"></div>
      <div class="field"><label>跳脫延遲 (ms)</label><input id="cfgDelay" type="number"></div>
      <div class="field"><label>回差 (mA)</label><input id="cfgHys" type="number"></div>
    </div>
    <div class="muted" style="margin-top:10px">安全/連續策略在自動學習完成後會以 MCU 學習值為主；手動保護只依照這裡設定的門檻、延遲與回差。</div>
    <div class="modal-actions"><button class="btn" onclick="closeRelayConfig()">取消</button><button class="btn primary" onclick="saveRelayConfig()">保存</button></div>
  </div>
</div>
<div class="modal hidden" id="schedulerEditModal">
  <div class="modal-card">
    <h2 id="schedulerEditTitle">新增排程</h2>
    <div class="split">
      <div class="field"><label>開啟時間</label><input id="schedulerStart" type="time" value="08:00"></div>
      <div class="field"><label>關閉時間</label><input id="schedulerEnd" type="time" value="10:00"></div>
    </div>
    <div class="muted" style="margin-top:10px">排程只記錄開啟時間段；時間結束時 MCU 會自動關閉。</div>
    <div class="modal-actions"><button class="btn" onclick="closeSchedulerEdit()">取消</button><button class="btn primary" onclick="saveSchedulerEdit()">新增</button></div>
  </div>
</div>
<div class="modal hidden" id="schedulerCopyModal">
  <div class="modal-card">
    <h2 id="schedulerCopyTitle">複製排程</h2>
    <div class="muted">選擇要覆蓋到哪些星期。</div>
    <div class="grid" id="schedulerCopyBody" style="margin-top:10px"></div>
    <div class="modal-actions"><button class="btn" onclick="closeSchedulerCopy()">取消</button><button class="btn primary" onclick="saveSchedulerCopy()">複製</button></div>
  </div>
</div>
<script>
"use strict";
const T={overview:"總覽",relays:"繼電器控制",scheduler:"排程器",protection:"保護",nodes:"節點",cloud:"後端認領",keys:"金鑰",events:"事件",search:"搜尋",refresh:"重新整理",online:"在線",offline:"離線",unknown:"未知",open:"開啟",close:"關閉",on:"開啟",off:"關閉",pending:"等待確認",allOn:"全部開啟",allOff:"全部關閉",nodeAllOn:"此節點全開",nodeAllOff:"此節點全關",forceStop:"強制停止",shortStop:"強停",unlock:"解除鎖定",clearLearning:"清除學習",clearShort:"清學習",nodeList:"節點清單",relayState:"Relay",adc:"ADC/CT",lastSeen:"最後上報",action:"操作",status:"狀態",role:"角色",cluster:"叢集",ip:"IP",control:"控制",ctReady:"CT 就緒",ctNotReady:"CT 未就緒",noNodes:"目前沒有節點。",backendSummary:"後端摘要",recentEvents:"最近事件",noData:"沒有資料",noEvents:"尚無事件",noControlNodes:"沒有可控制的節點。",protectionOps:"保護操作",channel:"通道",enable:"啟用",pause1h:"暫停 1 小時",resume:"恢復",cloudDevices:"雲端裝置",cloudClusters:"叢集",apiKeys:"API 金鑰",createKey:"新增金鑰",keyName:"金鑰名稱",created:"金鑰已建立",updated:"已更新",loadFail:"初始載入失敗",sseFallback:"SSE 斷線，改用輪詢更新"};
const PAGES=["overview","relays","scheduler","protection","nodes","cloud","keys","events"];
const state={summary:{},clients:[],nodes:[],cloudDevices:[],cloudClusters:[],keys:[],events:[],page:"overview",filter:"",selectedCluster:"",selectedNode:0,selectedChannel:1,loggedIn:false};
const relayCfg=new Map(),protectionCache=new Map(),protectionAt=new Map(),protectionGlobalCache=new Map(),schedulerStatusCache=new Map(),schedulerWeekCache=new Map(),pending=new Map();
let renderTimer=0,pauseModalResolve=null,pauseModalTarget=null,relayCfgTarget=null,schedulerEditTarget=null,schedulerCopyTarget=null,appStarted=false;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d;}
function validNum(v,d,min){const n=Number(v);if(!Number.isFinite(n))return d;if(min!==undefined&&n<min)return d;return n;}
function relayCfgLimit(v){return validNum(v,4500,100);}
function relayCfgDelay(v){return validNum(v,1000,0);}
function relayCfgHys(v,limit){const n=Number(v);return(Number.isFinite(n)&&n>=0&&n<limit)?n:500;}
function protCfgVal(cfg,key,d,min){return validNum(cfg&&cfg[key],d,min);}
function bit(mask,ch){return !!((num(mask)>>>0)&(1<<(ch-1)));}
function pill(text,cls){return `<span class="pill ${cls}">${esc(text)}</span>`;}
function roleText(r){return num(r)===2?"Master":num(r)===1?"Member":T.unknown;}
function onlinePill(n){return num(n.online)?pill(T.online,"ok"):pill(T.offline,"off");}
function rolePill(n){return pill(roleText(n.role),num(n.role)===2?"info":"off");}
function fmtTime(s){if(!s)return"-";const d=typeof s==="number"&&s<2000000000?new Date(s*1000):new Date(s);return Number.isNaN(d.getTime())?String(s):d.toLocaleString("zh-TW",{hour12:false});}
function fmtMinuteTime(mins){const n=num(mins,-1);if(n<0)return"--:--";return `${String(Math.floor(n/60)%24).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;}
function deviceName(n){return String(n.device||n.name||n.cloudDeviceId||`Node ${n.nodeId||"-"}`);}
function nodeTitle(n){return deviceName(n);}
function nodeLabelById(id){const n=nodes().find(x=>num(x.nodeId)===num(id));return n?nodeTitle(n):`Node ${id}`;}
function nodeCluster(n){return String(n.cluster||n.clusterName||n.cloudClusterId||"default");}
function toast(msg,bad=false){const el=document.createElement("div");el.className=bad?"bad":"";el.textContent=msg;$("toast").appendChild(el);setTimeout(()=>el.remove(),3000);}
function pendingKey(n,ch,op="relay"){return `${op}:${num(n)}:${num(ch)}`;}
function isPending(n,ch){return [...pending.keys()].some(k=>k.includes(`:${num(n)}:${num(ch)}`));}
async function api(path,opt={}){const headers=Object.assign({},opt.headers||{});if(opt.body&&typeof opt.body!=="string"){headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body);}const res=await fetch(path,Object.assign({credentials:"same-origin"},opt,{headers}));const text=await res.text();let data;try{data=text?JSON.parse(text):{};}catch(_){data={ok:false,error:text||`HTTP ${res.status}`};}if(res.status===401){showLogin();throw new Error("unauthorized");}if(!res.ok||data.ok===false)throw new Error(data.error||`HTTP ${res.status}`);return data;}
function showLogin(){state.loggedIn=false;$("loginView").classList.remove("hidden");$("appView").classList.add("hidden");}
function showApp(){state.loggedIn=true;$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");}
async function login(username,password){await api("/api/auth/login",{method:"POST",body:{username,password}});showApp();startApp();await manualRefresh();}
async function logout(){try{await api("/api/auth/logout",{method:"POST",body:{}});}catch(_){}showLogin();}
function applyPayload(p){state.summary=p.summary||state.summary;state.clients=(p.clients&&p.clients.clients)||p.clients||state.clients;state.nodes=(p.knownNodes&&p.knownNodes.nodes)||p.nodes||state.nodes;state.cloudDevices=(p.cloudDevices&&p.cloudDevices.devices)||p.cloudDevices||state.cloudDevices;state.cloudClusters=(p.cloudClusters&&p.cloudClusters.clusters)||p.cloudClusters||state.cloudClusters;state.events=(p.events&&p.events.events)||p.events||state.events;scheduleRender();}
function nodes(){const map=new Map();for(const n of state.nodes||[]){const id=num(n.nodeId||n.node_id);if(id>0)map.set(String(id),Object.assign({},n,{nodeId:id}));}for(const c of state.clients||[]){const id=num(c.nodeId||c.node_id);if(id>0)map.set(String(id),Object.assign({},map.get(String(id))||{},c,{nodeId:id,online:c.stale?0:1}));}for(const d of state.cloudDevices||[]){const id=num(d.nodeId||d.node_id);if(id>0&&!map.has(String(id)))map.set(String(id),Object.assign({},d,{nodeId:id}));}return[...map.values()].sort((a,b)=>nodeCluster(a)===nodeCluster(b)?num(a.nodeId)-num(b.nodeId):nodeCluster(a).localeCompare(nodeCluster(b)));}
function clusterOptions(){const set=new Set();for(const n of nodes())set.add(nodeCluster(n));for(const c of state.cloudClusters||[])set.add(String(c.clusterId||c.clusterName||"default"));return[...set].filter(Boolean).sort();}
function filteredNodes(){const q=state.filter.trim().toLowerCase();let list=nodes();if(state.selectedCluster)list=list.filter(n=>nodeCluster(n)===state.selectedCluster);if(!q)return list;return list.filter(n=>JSON.stringify(n).toLowerCase().includes(q));}
function normalizeRelayConfig(data){const raw=Array.isArray(data.relays)?data.relays:Array.isArray(data.channels)?data.channels:[];const out=Array.from({length:16},(_,i)=>({channel:i+1,name:`Relay${i+1}`,enabled:1,remember_state:0,boot_default_on:0,protection_enabled:0,device_strategy:0,overcurrent_milliamps:4500,trip_delay_ms:1000,reset_hysteresis_milliamps:500}));for(const r of raw){const ch=num(r.channel||r.ch||r.index);if(ch>=1&&ch<=16)out[ch-1]=Object.assign({},out[ch-1],r,{channel:ch,name:String(r.name||r.label||`Relay${ch}`)});}return out;}
function relayConfig(n,ch){const cfg=relayCfg.get(String(n));return cfg&&cfg[ch-1]?cfg[ch-1]:{channel:ch,name:`Relay${ch}`,enabled:1};}
function relayName(n,ch){const cfg=relayConfig(n,ch);return `${cfg.name||`Relay${ch}`} CH${ch}`;}
async function loadRelayConfigFor(n,force=false){const key=String(n);if(!force&&relayCfg.has(key))return relayCfg.get(key);if(!relayCfg.has(key))relayCfg.set(key,normalizeRelayConfig({}));try{const data=await api(`/api/config/${encodeURIComponent(n)}/relays`);relayCfg.set(key,normalizeRelayConfig(data));scheduleRender();}catch(_){}return relayCfg.get(key);}
function normalizeProtectionSnapshot(data){const list=Array.isArray(data?.channels)?data.channels:[];return Object.assign({},data,{channels:list.map(x=>{const current=num(x.current_ma??x.current_milliamps??x.adc_current_ma??x.adc_current_milliamps,0);return Object.assign({},x,{ch:num(x.ch||x.channel),channel:num(x.channel||x.ch),current_ma:current,current_milliamps:current,ct_valid:(x.ct_valid===undefined)?1:num(x.ct_valid)});})});}
async function loadProtectionFor(n,force=false){const key=String(n);const age=Date.now()-(protectionAt.get(key)||0);if(!force&&protectionCache.has(key)&&age<5000)return protectionCache.get(key);try{const data=normalizeProtectionSnapshot(await api(`/api/cluster/node/${encodeURIComponent(n)}/protection`));protectionCache.set(key,data);protectionAt.set(key,Date.now());scheduleRender();return data;}catch(_){return protectionCache.get(key)||null;}}
async function loadProtectionGlobalFor(n,force=false){const key=String(n);if(!force&&protectionGlobalCache.has(key))return protectionGlobalCache.get(key);try{const data=await api(`/api/cluster/node/${encodeURIComponent(n)}/config/protection`);protectionGlobalCache.set(key,data);scheduleRender();return data;}catch(_){return protectionGlobalCache.get(key)||null;}}
function protectionChannelInfo(nodeId,ch){const snap=protectionCache.get(String(nodeId));const list=Array.isArray(snap?.channels)?snap.channels:[];return list.find(x=>num(x.channel||x.ch)===num(ch))||null;}
function protectionFromMasks(n,ch){return{channel:ch,ch,protection_enabled:bit(n.protectionEnabledMask,ch)?1:0,tripped:bit(n.protectionTrippedMask,ch)?1:0,fault_locked:bit(n.protectionFaultLockMask,ch)?1:0,ct_valid:bit(n.protectionCtValidMask,ch)?1:0,current_ma:null,learning_complete:bit(n.protectionLearningMask,ch)?1:0,device_strategy:(bit(n.protectionStrategyLsbMask,ch)?1:0)|(bit(n.protectionStrategyMsbMask,ch)?2:0),fallback:1};}

function renderNodeRelays(n){const mask=num(n.relayMask)>>>0;return`<section class="node"><div class="node-head"><div><div class="node-title">${esc(nodeTitle(n))}</div><div class="muted">IP ${esc(n.ip||"-")} · 叢集 ${esc(nodeCluster(n))}</div></div><div class="node-meta">${onlinePill(n)} ${rolePill(n)} ${pill(`Relay 0x${mask.toString(16).padStart(4,"0")}`,"info")}<button class="btn green" onclick="sendAll(${num(n.nodeId)},1)" ${num(n.online)?"":"disabled"}>${T.nodeAllOn}</button><button class="btn red" onclick="sendAll(${num(n.nodeId)},0)" ${num(n.online)?"":"disabled"}>${T.nodeAllOff}</button></div></div><div class="relay-grid">${Array.from({length:16},(_,i)=>renderRelayCard(n,i+1,!!(mask&(1<<i)))).join("")}</div></section>`;}

function renderRelayCard(n,ch,on){const p=isPending(n.nodeId,ch);const disabled=!num(n.online)||p;const prot=protectionChannelInfo(n.nodeId,ch)||protectionFromMasks(n,ch);const cfg=relayConfig(n.nodeId,ch);const ctValid=num(prot.ct_valid);const currentMa=prot.current_ma==null?null:num(prot.current_ma);const locked=num(prot.fault_locked||prot.locked);const tripped=num(prot.tripped);const forced=num(prot.force_stop||prot.forceStop);const lockedState=locked||tripped||forced;const cardCls=lockedState?"locked":(on?"on":"off");const adcText=ctValid?(currentMa==null?"讀取中…":`${currentMa} mA`):T.ctNotReady;return`<article class="relay ${cardCls} ${p?"pending":""}"><h3>${esc(relayName(n.nodeId,ch))}</h3><div class="state">${on?pill(T.on,"ok"):pill(T.off,"off")} ${p?pill(T.pending,"pending"):""} ${forced?pill("強停","warn"):""} ${tripped?pill("跳脫","warn"):""} ${locked?pill("鎖定","off"):""}</div><div>${schedulerChips(n,ch)}</div><div class="adc">${esc(adcText)}</div><div class="muted">CH${ch}${cfg.enabled===0?" · 已停用":""}</div><div class="relay-actions"><button class="btn ${on?"orange":"green"} main" onclick="sendRelay(${num(n.nodeId)},${ch},${on?0:1})" ${disabled||lockedState?"disabled":""}>${on?T.close:T.open}</button><div class="right">${lockedState?`<button class="btn" onclick="unlock(${num(n.nodeId)},${ch})" ${num(n.online)&&!p?"":"disabled"}>${T.unlock}</button>`:""}<button class="btn red" onclick="forceStop(${num(n.nodeId)},${ch})" ${num(n.online)&&!p?"":"disabled"}>${T.shortStop}</button><button class="btn" onclick="openRelayConfig(${num(n.nodeId)},${ch})">${T.control}</button></div></div></article>`;}
function optimisticMask(n,ch,value){for(const node of state.nodes){if(num(node.nodeId)===num(n)){const b=1<<(ch-1);node.relayMask=value?((num(node.relayMask)>>>0)|b):((num(node.relayMask)>>>0)&~b);}}}
async function loadSchedulerStatus(nodeId,ch,force=false){const key=`${num(nodeId)}:${num(ch)}`;if(!force&&schedulerStatusCache.has(key))return schedulerStatusCache.get(key);const data=await api(`/api/scheduler/${encodeURIComponent(nodeId)}/${encodeURIComponent(ch)}/status`);schedulerStatusCache.set(key,data);return data;}

async function maybePauseSchedulerBeforeOn(n,ch){try{const s=await loadSchedulerStatus(n,ch,true);const enabled=!!(s&&(s.schedule_enabled||s.scheduleEnabled));const paused=!!(s&&(s.pause_active||s.pauseActive));if(!enabled||paused)return true;const body=await askPauseBeforeControl(n,ch);if(!body)return false;if(body.disable_scheduler){await api(`/send/${encodeURIComponent(n)}/scheduler/enabled`,{method:"POST",body:{channel:ch,enabled:0,targetNodeId:n}});}else{await api(`/send/${encodeURIComponent(n)}/scheduler/pause`,{method:"POST",body});}schedulerStatusCache.delete(`${num(n)}:${num(ch)}`);return true;}catch(e){toast(`排程暫停失敗：${e.message}`,true);return false;}}
function askPauseBeforeControl(n,ch){return new Promise(resolve=>{pauseModalResolve=resolve;pauseModalTarget={nodeId:num(n),channel:num(ch)};$("pauseTitle").textContent=`${relayName(n,ch)} 排程正在管理`;document.querySelectorAll('input[name="pauseMode"]').forEach(r=>{r.checked=r.value==="segment";});$("pauseCustom").value="";$("pauseBlockAuto").checked=false;$("pauseModal").classList.remove("hidden");});}
function resolvePauseModal(ok){const modal=$("pauseModal");if(!pauseModalResolve){modal.classList.add("hidden");return;}if(!ok){modal.classList.add("hidden");pauseModalResolve(null);pauseModalResolve=null;pauseModalTarget=null;return;}const mode=(document.querySelector('input[name="pauseMode"]:checked')||{}).value||"segment";const body={channel:pauseModalTarget.channel,targetNodeId:pauseModalTarget.nodeId,mode:0,pause_blocks_auto_trigger:$("pauseBlockAuto").checked?1:0};if(mode==="segment"){body.mode=1;body.duration_seconds=60;}else if(mode==="1hr"){body.mode=1;body.duration_seconds=3600;}else if(mode==="1day"){body.mode=1;body.duration_seconds=86400;}else if(mode==="custom"){const ts=Date.parse($("pauseCustom").value);if(!Number.isFinite(ts)){toast("請選擇暫停到什麼時間",true);return;}body.mode=2;body.until=Math.floor(ts/1000);}else if(mode==="disable"){body.disable_scheduler=1;}modal.classList.add("hidden");pauseModalResolve(body);pauseModalResolve=null;pauseModalTarget=null;}
async function sendRelay(n,ch,value){const key=pendingKey(n,ch);const node=nodes().find(x=>num(x.nodeId)===num(n));const prevMask=node?num(node.relayMask)>>>0:0;if(!await maybePauseSchedulerBeforeOn(n,ch))return;pending.set(key,Date.now());optimisticMask(n,ch,value);render();try{await api(`/send/${encodeURIComponent(n)}/relay`,{method:"POST",body:{channel:ch,value,targetNodeId:n}});await loadProtectionFor(n,true);toast(`${nodeLabelById(n)} CH${ch} OK`);}catch(e){if(node)node.relayMask=prevMask;toast(`relay failed: ${e.message}`,true);}finally{setTimeout(()=>{pending.delete(key);scheduleRender();},1200);}}
async function sendAll(n,value){for(let ch=1;ch<=16;ch++)pending.set(pendingKey(n,ch),Date.now());const node=nodes().find(x=>num(x.nodeId)===num(n));const prevMask=node?num(node.relayMask)>>>0:0;for(let ch=1;ch<=16;ch++){if(!await maybePauseSchedulerBeforeOn(n,ch)){for(let i=1;i<=16;i++)pending.delete(pendingKey(n,i));scheduleRender();return;}}if(node)node.relayMask=value?0xffff:0;render();try{await api(`/send/${encodeURIComponent(n)}/all`,{method:"POST",body:{value,targetNodeId:n}});await loadProtectionFor(n,true);toast(`${nodeLabelById(n)} OK`);}catch(e){if(node)node.relayMask=prevMask;toast(`all failed: ${e.message}`,true);}finally{setTimeout(()=>{for(let ch=1;ch<=16;ch++)pending.delete(pendingKey(n,ch));scheduleRender();},1400);}}
async function bulkAll(value){for(const n of filteredNodes().filter(x=>num(x.online)))await sendAll(num(n.nodeId),value);}
async function forceStop(n,ch){const key=pendingKey(n,ch,"prot");pending.set(key,Date.now());render();try{optimisticMask(n,ch,0);await api(`/send/${encodeURIComponent(n)}/protection/force-stop`,{method:"POST",body:{channel:ch,targetNodeId:n}});await loadProtectionFor(n,true);toast(`${nodeLabelById(n)} CH${ch} ${T.forceStop}`);}catch(e){toast(`force stop failed: ${e.message}`,true);}finally{pending.delete(key);scheduleRender();}}

function openRelayConfig(n,ch){const cfg=relayConfig(n,ch);const limit=relayCfgLimit(cfg.overcurrent_milliamps);relayCfgTarget={nodeId:num(n),channel:num(ch)};$("relayConfigTitle").textContent=`${relayName(n,ch)} 設定`;$("cfgName").value=cfg.name||"";$("cfgEnabled").checked=num(cfg.enabled,1)?true:false;$("cfgRemember").checked=num(cfg.remember_state)?true:false;$("cfgBoot").checked=num(cfg.boot_default_on)?true:false;$("cfgProtection").checked=num(cfg.protection_enabled)?true:false;$("cfgStrategy").value=String(num(cfg.device_strategy));$("cfgLimit").value=limit;$("cfgDelay").value=relayCfgDelay(cfg.trip_delay_ms);$("cfgHys").value=relayCfgHys(cfg.reset_hysteresis_milliamps,limit);$("relayConfigModal").classList.remove("hidden");}

function protectionGlobalForm(nodeId,cfg){cfg=cfg||{};return`<div class="panel"><div class="panel-h"><h2>全域保護設定</h2><span class="muted">${esc(nodeTitle(nodes().find(n=>num(n.nodeId)===num(nodeId))||{nodeId}))}</span></div><div class="panel-b"><div class="grid"><div class="field"><label>冷卻時間 (s)</label><input id="protCooldown" type="number" value="${esc(protCfgVal(cfg,'cooldown_seconds',3,0))}"></div><div class="field"><label>重試延遲 (s)</label><input id="protRetryDelay" type="number" value="${esc(protCfgVal(cfg,'retry_delay_seconds',30,0))}"></div><div class="field"><label>最大重試</label><input id="protMaxRetry" type="number" value="${esc(protCfgVal(cfg,'max_retry_count',1,0))}"></div><div class="field"><label>開機延遲 (s)</label><input id="protBootDelay" type="number" value="${esc(protCfgVal(cfg,'boot_delay_seconds',30,0))}"></div><div class="field"><label>學習樣本</label><input id="protSamples" type="number" value="${esc(protCfgVal(cfg,'learning_samples',5,1))}"></div><div class="field"><label>老化更新週期 (h)</label><input id="protAgingHours" type="number" value="${esc(protCfgVal(cfg,'aging_update_hours',24,1))}"></div><div class="field"><label>老化上限 (%)</label><input id="protAgingCap" type="number" value="${esc(protCfgVal(cfg,'aging_cap_percent',20,0))}"></div><div class="field"><label>卡滯倍率 x10</label><input id="protStall" type="number" value="${esc(protCfgVal(cfg,'stall_multiplier_x10',3,1))}"></div></div><button class="btn primary" onclick="saveProtectionGlobal(${num(nodeId)})">保存全域保護設定</button></div></div>`;}
async function saveProtectionGlobal(nodeId){const body={cooldown_seconds:validNum($("protCooldown").value,3,0),retry_delay_seconds:validNum($("protRetryDelay").value,30,0),max_retry_count:validNum($("protMaxRetry").value,1,0),boot_delay_seconds:validNum($("protBootDelay").value,30,0),learning_samples:validNum($("protSamples").value,5,1),aging_update_hours:validNum($("protAgingHours").value,24,1),aging_cap_percent:validNum($("protAgingCap").value,20,0),stall_multiplier_x10:validNum($("protStall").value,3,1)};try{await api(`/api/cluster/node/${encodeURIComponent(nodeId)}/config/protection`,{method:"POST",body});protectionGlobalCache.delete(String(nodeId));await loadProtectionGlobalFor(nodeId,true);toast("全域保護設定已更新");}catch(e){toast(`保存全域保護失敗：${e.message}`,true);}}
function renderProtection(){const list=filteredNodes();if(!state.selectedNode&&list[0])state.selectedNode=num(list[0].nodeId);const nodeId=num(state.selectedNode||0);if(nodeId){void loadRelayConfigFor(nodeId);void loadProtectionFor(nodeId);void loadProtectionGlobalFor(nodeId);}const gcfg=protectionGlobalCache.get(String(nodeId))||{};const rows=[];const n=list.find(x=>num(x.nodeId)===nodeId)||list[0];if(n){for(let ch=1;ch<=16;ch++)rows.push({n,ch});}$("content").innerHTML=toolbar(`<div class="field"><label>節點</label><select id="protNode">${list.map(n=>`<option value="${esc(n.nodeId)}" ${num(n.nodeId)===nodeId?"selected":""}>${esc(nodeTitle(n))}</option>`).join("")}</select></div>`)+(nodeId?protectionGlobalForm(nodeId,gcfg):"")+`<div class="panel"><div class="panel-h"><h2>${T.protectionOps}</h2><span class="muted">安全優先會傾向停機保護；連續優先會對非致命異常先警告或延後停機；手動保護只依照手動門檻。</span></div><div class="table-wrap"><table><thead><tr><th>Relay</th><th>${T.status}</th><th>故障原因</th><th>${T.adc}</th><th>策略</th><th>學習資訊</th><th>${T.action}</th></tr></thead><tbody>${rows.map(({n,ch})=>{const prot=protectionChannelInfo(n.nodeId,ch)||protectionFromMasks(n,ch);const cfg=relayConfig(n.nodeId,ch);const ctValid=num(prot.ct_valid);const currentMa=prot.current_ma==null?null:num(prot.current_ma);const locked=num(prot.fault_locked||prot.locked),tripped=num(prot.tripped),forced=num(prot.force_stop||prot.forceStop);const lockedState=locked||tripped||forced;const strategy=["安全優先","連續優先","手動保護"][num(prot.device_strategy??prot.strategy)]||"安全優先";return`<tr><td><b>${esc(relayName(n.nodeId,ch))}</b></td><td>${forced?pill("強停","warn"):tripped?pill("跳脫","warn"):locked?pill("鎖定","off"):pill("正常","ok")}</td><td>${esc(prot.fault_reason??prot.fault_type??"無")}<br><span class="muted">重試 ${esc(prot.retry_count??prot.trip_count??0)}</span></td><td>${ctValid?pill(T.ctReady,"ok"):pill(T.ctNotReady,"warn")} ${ctValid&&currentMa!=null?`${currentMa} mA`:""}<br><span class="muted">門檻 ${esc(cfg.overcurrent_milliamps??"-")} mA / function schedulerDayName(wd){return["週一","週二","週三","週四","週五","週六","週日"][num(wd)]||`D${wd}`;}
function scheduleDays(week){const raw=Array.isArray(week?.days)?week.days:Array.isArray(week?.weekdays)?week.weekdays:[];return Array.from({length:7},(_,wd)=>raw.find(d=>num(d.weekday)===wd)||{weekday:wd,intervals:[]});}
function scheduleIntervals(week,wd){const d=scheduleDays(week)[wd]||{};return Array.isArray(d.intervals)?d.intervals.map(it=>({start_minute:num(it.start_minute??it.start),end_minute:num(it.end_minute??it.end)})).filter(it=>it.end_minute>it.start_minute):[];}
function parseHm(v){const m=String(v||"").trim().match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;const h=num(m[1],-1),mm=num(m[2],-1);if(h<0||h>23||mm<0||mm>59)return null;return h*60+mm;}
async function schedulerSetDay(nodeId,ch,wd,intervals){const body={count:intervals.length};intervals.forEach((iv,i)=>{body[`s${i}`]=iv.start_minute;body[`e${i}`]=iv.end_minute;});await api(`/api/scheduler/${encodeURIComponent(nodeId)}/${encodeURIComponent(ch)}/week/${encodeURIComponent(wd)}`,{method:"PUT",body});schedulerWeekCache.delete(`${num(nodeId)}:${num(ch)}`);await loadSchedulerWeek(nodeId,ch,true);scheduleRender();}
function schedulerAddInterval(wd){schedulerEditTarget={nodeId:num(state.selectedNode),channel:num(state.selectedChannel||1),weekday:num(wd)};$("schedulerEditTitle").textContent=`新增 ${schedulerDayName(wd)} 排程`;$("schedulerStart").value="08:00";$("schedulerEnd").value="10:00";$("schedulerEditModal").classList.remove("hidden");}
function closeSchedulerEdit(){$("schedulerEditModal").classList.add("hidden");schedulerEditTarget=null;}
async function saveSchedulerEdit(){if(!schedulerEditTarget)return;const {nodeId,channel,weekday}=schedulerEditTarget;const week=schedulerWeekCache.get(`${nodeId}:${channel}`)||{};const start=parseHm($("schedulerStart").value);const end=parseHm($("schedulerEnd").value);if(start==null)return toast("開啟時間格式錯誤",true);if(end==null||end<=start)return toast("關閉時間必須晚於開啟時間",true);const intervals=scheduleIntervals(week,weekday).concat([{start_minute:start,end_minute:end}]).sort((a,b)=>a.start_minute-b.start_minute);try{await schedulerSetDay(nodeId,channel,weekday,intervals);closeSchedulerEdit();toast("排程已新增");}catch(e){toast(`新增排程失敗：${e.message}`,true);}}
async function schedulerDeleteInterval(wd,idx){const nodeId=num(state.selectedNode),ch=num(state.selectedChannel||1),week=schedulerWeekCache.get(`${nodeId}:${ch}`)||{};const intervals=scheduleIntervals(week,wd);if(!intervals[idx])return;intervals.splice(idx,1);try{await schedulerSetDay(nodeId,ch,wd,intervals);toast("排程已刪除");}catch(e){toast(`刪除排程失敗：${e.message}`,true);}}
async function schedulerClearDay(wd){const nodeId=num(state.selectedNode),ch=num(state.selectedChannel||1);try{await schedulerSetDay(nodeId,ch,wd,[]);toast(`${schedulerDayName(wd)} 已清空`);}catch(e){toast(`清空排程失敗：${e.message}`,true);}}
function schedulerCopyDay(wd){schedulerCopyTarget={nodeId:num(state.selectedNode),channel:num(state.selectedChannel||1),weekday:num(wd)};$("schedulerCopyTitle").textContent=`複製 ${schedulerDayName(wd)} 的排程`;$("schedulerCopyBody").innerHTML=Array.from({length:7},(_,i)=>i).filter(i=>i!==wd).map(i=>`<label><input type="checkbox" class="schedCopyTarget" value="${i}"> ${esc(schedulerDayName(i))}</label>`).join("");$("schedulerCopyModal").classList.remove("hidden");}
function closeSchedulerCopy(){$("schedulerCopyModal").classList.add("hidden");schedulerCopyTarget=null;}
async function saveSchedulerCopy(){if(!schedulerCopyTarget)return;const {nodeId,channel,weekday}=schedulerCopyTarget;const targets=[...document.querySelectorAll(".schedCopyTarget:checked")].map(el=>num(el.value)).filter(x=>x>=0&&x<=6&&x!==weekday);if(!targets.length)return toast("請至少選擇一個目標星期",true);try{await api(`/api/scheduler/${encodeURIComponent(nodeId)}/${encodeURIComponent(channel)}/copy`,{method:"POST",body:{source_weekday:weekday,target_weekdays:targets.join(",")}});schedulerWeekCache.delete(`${nodeId}:${channel}`);await loadSchedulerWeek(nodeId,channel,true);closeSchedulerCopy();scheduleRender();toast("排程已複製");}catch(e){toast(`複製排程失敗：${e.message}`,true);}}
function renderScheduleWeek(week){return`<div class="card-grid">${scheduleDays(week).map(d=>{const wd=num(d.weekday),items=Array.isArray(d.intervals)?d.intervals:[];const body=items.length?items.map((it,idx)=>`<div class="metric"><b>${esc(fmtMinuteTime(it.start_minute??it.start??0))} → ${esc(fmtMinuteTime(it.end_minute??it.end??0))}</b><span>開啟時間 → 關閉時間</span><button class="btn red" onclick="schedulerDeleteInterval(${wd},${idx})">刪除</button></div>`).join(""):`<div class="muted">全天 OFF，沒有已設定的開啟時段</div>`;return`<article class="relay"><div class="panel-h" style="padding:0 0 8px;background:transparent;border:0"><h3>${esc(schedulerDayName(wd))}</h3><div class="actions"><button class="btn green" onclick="schedulerAddInterval(${wd})">新增</button><button class="btn" onclick="schedulerCopyDay(${wd})">複製</button><button class="btn red" onclick="schedulerClearDay(${wd})">清空</button></div></div><div>${body}</div></article>`;}).join("")}</div>`;}
function renderScheduler(){const list=filteredNodes();if(!state.selectedNode&&list[0])state.selectedNode=num(list[0].nodeId);const nodeId=num(state.selectedNode||0);const ch=num(state.selectedChannel||1);const key=`${nodeId}:${ch}`;if(nodeId){loadRelayConfigFor(nodeId).catch(()=>{});loadSchedulerStatus(nodeId,ch).catch(()=>{});loadSchedulerWeek(nodeId,ch).catch(()=>{});}const status=schedulerStatusCache.get(key)||{};const week=schedulerWeekCache.get(key)||{};const pauseUntil=status.schedule_pause_until||status.pause_until||status.pauseUntil||0;const enabled=num(status.schedule_enabled??status.enabled);$("content").innerHTML=toolbar(`<div class="field"><label>節點</label><select id="schedNode">${list.map(n=>`<option value="${esc(n.nodeId)}" ${num(n.nodeId)===nodeId?"selected":""}>${esc(nodeTitle(n))}</option>`).join("")}</select></div><div class="field"><label>通道</label><select id="schedCh">${Array.from({length:16},(_,i)=>`<option value="${i+1}" ${i+1===ch?"selected":""}>${esc(relayName(nodeId,i+1))}</option>`).join("")}</select></div><button class="btn green" onclick="schedulerEnabled(1)">${T.enable}</button><button class="btn orange" onclick="schedulerPause()">${T.pause1h}</button><button class="btn blue" onclick="schedulerResume()">${T.resume}</button>`)+`<div class="panel"><div class="panel-h"><h2>${T.scheduler}</h2><div>${pill(enabled?"排程已啟用":"排程已停用",enabled?"ok":"off")} ${pauseUntil?pill(`暫停至 ${fmtTime(pauseUntil)}`,"warn"):""}</div></div><div class="panel-b"><div class="grid"><div class="metric"><b>${esc(nodeTitle(nodes().find(n=>num(n.nodeId)===nodeId)||{nodeId}))}</b><span>節點 / 通道 ${ch}</span></div><div class="metric"><b>${enabled?"ON":"OFF"}</b><span>排程狀態</span></div><div class="metric"><b>${pauseUntil?fmtTime(pauseUntil):"-"}</b><span>暫停到</span></div></div></div></div><div class="panel"><div class="panel-h"><h2>一週排程</h2><span class="muted">和 MCU Web 相同：每一天可新增、刪除、清空、複製時段。</span></div><div class="panel-b">${renderScheduleWeek(week)}</div></div>`;bindFilter();const sn=$("schedNode"),sc=$("schedCh");if(sn)sn.onchange=()=>{state.selectedNode=num(sn.value);scheduleRender();refreshVisibleDetails();};if(sc)sc.onchange=()=>{state.selectedChannel=num(sc.value);scheduleRender();refreshVisibleDetails();};}
async function schedulerEnabled(enabled){try{await api(`/send/${encodeURIComponent(state.selectedNode)}/scheduler/enabled`,{method:"POST",body:{channel:state.selectedChannel,enabled,targetNodeId:state.selectedNode}});schedulerStatusCache.delete(`${num(state.selectedNode)}:${num(state.selectedChannel)}`);toast("scheduler OK");refreshVisibleDetails();}catch(e){toast(`scheduler failed: ${e.message}`,true);}}
async function schedulerPause(){try{await api(`/send/${encodeURIComponent(state.selectedNode)}/scheduler/pause`,{method:"POST",body:{channel:state.selectedChannel,mode:1,duration_seconds:3600,targetNodeId:state.selectedNode}});schedulerStatusCache.delete(`${num(state.selectedNode)}:${num(state.selectedChannel)}`);toast("scheduler pause OK");refreshVisibleDetails();}catch(e){toast(`pause failed: ${e.message}`,true);}}
async function schedulerResume(){try{await api(`/send/${encodeURIComponent(state.selectedNode)}/scheduler/resume`,{method:"POST",body:{channel:state.selectedChannel,targetNodeId:state.selectedNode}});schedulerStatusCache.delete(`${num(state.selectedNode)}:${num(state.selectedChannel)}`);toast("scheduler resume OK");refreshVisibleDetails();}catch(e){toast(`resume failed: ${e.message}`,true);}}
function simpleTable(list,cols){if(!Array.isArray(list)||!list.length)return`<div class="empty">${T.noData}</div>`;return`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${list.map(row=>`<tr>${cols.map(c=>`<td>${typeof row[c]==="object"?esc(JSON.stringify(row[c])):esc(row[c]??"-")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;}
function renderCloud(){$("content").innerHTML=`<div class="panel"><div class="panel-h"><h2>裝置認領</h2></div><div class="panel-b"><div class="claim-grid"><div class="field"><label>叢集 ID</label><input id="claimCluster" value="${esc(state.selectedCluster||"default")}"></div><div class="field"><label>Node ID</label><input id="claimNode" placeholder="例如 579948958"></div><div class="field"><label>Device ID</label><input id="claimDevice" placeholder="可留空自動建立"></div><div class="field"><label>顯示名稱</label><input id="claimName" placeholder="例如 客廳控制器"></div><button class="btn primary" onclick="claimNode()">認領 / 更新</button></div></div></div><div class="split"><div class="panel"><div class="panel-h"><h2>${T.cloudDevices}</h2></div><div class="table-wrap">${simpleTable(state.cloudDevices,["deviceId","nodeId","device","clusterId","online","lastSeenAt"])}</div></div><div class="panel"><div class="panel-h"><h2>${T.cloudClusters}</h2></div><div class="table-wrap">${simpleTable(state.cloudClusters,["clusterId","clusterName","enabled","onlineDevices","knownDevices","lastMasterNodeId"])}</div></div></div>`;}
async function claimNode(){const nodeId=num(($("claimNode")||{}).value);const clusterId=String(($("claimCluster")||{}).value||"default").trim()||"default";const deviceId=String(($("claimDevice")||{}).value||"").trim();const deviceName=String(($("claimName")||{}).value||"").trim();if(!nodeId){toast("請輸入 Node ID",true);return;}try{const body={clusterId,nodeId};if(deviceId)body.deviceId=deviceId;if(deviceName)body.deviceName=deviceName;await api("/api/cloud/claim-node",{method:"POST",body});state.selectedCluster=clusterId;await manualRefresh();toast("認領完成");}catch(e){toast(`認領失敗：${e.message}`,true);}}
function renderKeys(){$("content").innerHTML=`<div class="toolbar"><button class="btn primary" onclick="createKey()">${T.createKey}</button><button class="btn" onclick="manualRefresh()">${T.refresh}</button></div><div class="panel"><div class="panel-h"><h2>${T.apiKeys}</h2></div><div class="table-wrap">${simpleTable(state.keys,["id","label","enabled","createdAt","lastUsedAt"])}</div></div>`;}
async function createKey(){const label=prompt(T.keyName,"backend-key");if(!label)return;try{await api("/api/keys",{method:"POST",body:{label}});await manualRefresh();toast(T.created);}catch(e){toast(`key failed: ${e.message}`,true);}}
function eventSummary(e){if(!e||typeof e!=="object")return"-";const parts=[];const msg=e.message||e.summary||e.detail||e.text||e.note||e.error||"";if(msg)parts.push(String(msg));if(e.nodeId!=null)parts.push(`Node ${e.nodeId}`);if(e.channel!=null||e.ch!=null)parts.push(`CH${e.channel??e.ch}`);if(e.status!=null)parts.push(`status=${e.status}`);if(e.ip!=null)parts.push(`IP ${e.ip}`);return parts.length?parts.join(" · "):String(e.type||e.event||"-");}
function renderEventCards(list){if(!Array.isArray(list)||!list.length)return`<div class="empty">${T.noEvents}</div>`;return`<div class="card-grid">${list.map(e=>`<article class="relay"><h3>${esc(e.type||e.event||"-")}</h3><div class="muted">${esc(fmtTime(e.ts||e.time||e.at))}</div><div>${esc(eventSummary(e))}</div></article>`).join("")}</div>`;}
function renderEvents(){$("content").innerHTML=`<div class="toolbar"><button class="btn" onclick="manualRefresh()">${T.refresh}</button></div><div class="panel"><div class="panel-h"><h2>${T.events}</h2></div><div class="panel-b">${renderEventCards((state.events||[]).slice(-80).reverse())}</div></div>`;}
function focusRelay(n){state.filter=String(n);setPage("relays");}
async function manualRefresh(){try{await refreshOnce();await refreshVisibleDetails(true);toast(T.updated);}catch(e){toast(`refresh failed: ${e.message}`,true);}}
async function refreshVisibleDetails(force=false){if(!state.loggedIn)return;const list=filteredNodes().filter(n=>num(n.nodeId)>0);if(state.page==="relays"||state.page==="protection"){for(const n of list){loadRelayConfigFor(num(n.nodeId),force).catch(()=>{});loadProtectionFor(num(n.nodeId),force).catch(()=>{});}}if(state.page==="scheduler"&&state.selectedNode){loadRelayConfigFor(num(state.selectedNode),force).catch(()=>{});loadSchedulerStatus(state.selectedNode,state.selectedChannel,force).catch(()=>{});loadSchedulerWeek(state.selectedNode,state.selectedChannel,force).catch(()=>{});}}
function initNav(){const nav=$("nav");nav.innerHTML=PAGES.map(p=>`<button class="${p===state.page?"active":""}" data-page="${p}">${T[p]}</button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));$("title").textContent=T[state.page];}
function startApp(){if(appStarted)return;appStarted=true;initNav();setInterval(()=>{$("clock").textContent=new Date().toLocaleString("zh-TW",{hour12:false});},1000);setInterval(()=>refreshOnce().catch(()=>{}),15000);setInterval(()=>refreshVisibleDetails(false).catch(()=>{}),5000);connectStream();refreshOnce().catch(e=>toast(`${T.loadFail}: ${e.message}`,true));render();}
$("loginForm").addEventListener("submit",async(ev)=>{ev.preventDefault();try{await login($("loginUser").value,$("loginPass").value);}catch(e){toast(`登入失敗：${e.message}`,true);}});
api("/api/auth/session").then(()=>{showApp();startApp();}).catch(()=>showLogin());
</script>
</body>
