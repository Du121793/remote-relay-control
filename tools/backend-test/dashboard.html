<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>autoControl Backend</title>
<style>
:root{--bg:#eef3f8;--panel:#fff;--line:#dbe4ef;--text:#0f172a;--muted:#64748b;--nav:#0f172a;--nav2:#1e293b;--primary:#0891b2;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI","Microsoft JhengHei",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:var(--nav);color:#cbd5e1;padding:14px 10px}.brand{font-size:18px;font-weight:900;color:#fff;padding:8px 10px 14px;border-bottom:1px solid #334155;margin-bottom:8px}
.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:10px 12px;border-radius:8px;font-weight:800}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}
.main{min-width:0}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:13px}.content{padding:16px}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{min-width:160px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:4px}input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;color:var(--text)}
.btn{border:0;border-radius:8px;padding:8px 12px;font-weight:900;min-height:36px;background:#e2e8f0;color:var(--text)}.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.primary{background:var(--primary);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.orange{background:var(--orange);color:#fff}.btn.blue{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.metric b{display:block;font-size:28px;line-height:1}.metric span{display:block;color:var(--muted);margin-top:5px;font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}.panel-h{padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.panel-h h2{margin:0;font-size:17px}.panel-b{padding:12px 14px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{background:#f8fafc;color:#475569;font-size:12px;font-weight:900;white-space:nowrap}td.actions{white-space:nowrap}.muted{color:var(--muted)}.mono{font-family:Consolas,monospace}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;white-space:nowrap}.pill.ok{background:#dcfce7;color:#166534}.pill.off{background:#e2e8f0;color:#475569}.pill.err{background:#fee2e2;color:#991b1b}.pill.warn{background:#fef3c7;color:#92400e}.pill.info{background:#dbeafe;color:#1e40af}.pill.pending{background:#e0e7ff;color:#3730a3}
.node{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}.node-head{padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.node-title{font-size:17px;font-weight:900}.node-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.relay-grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.relay{border:1px solid var(--line);border-left:4px solid #cbd5e1;border-radius:10px;background:#fff;padding:11px;min-height:150px;display:flex;flex-direction:column;gap:7px}.relay.on{border-left-color:var(--green);background:#f0fdf4}.relay.pending{background:#f8fafc;opacity:.76;filter:saturate(.7)}.relay h3{margin:0;font-size:15px;word-break:break-word}.relay-actions{margin-top:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.relay-actions .btn{flex:1 1 auto}
.empty{padding:28px;text-align:center;color:var(--muted);font-weight:800}pre{margin:0;background:#0f172a;color:#dbeafe;border-radius:10px;padding:12px;overflow:auto;max-height:460px}.toast{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;flex-direction:column;gap:8px}.toast div{background:#0f172a;color:#fff;border-radius:8px;padding:9px 12px;font-weight:900;box-shadow:0 6px 20px rgba(15,23,42,.25)}.toast div.bad{background:var(--red)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:860px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;gap:6px;overflow:auto}.nav button{white-space:nowrap}.content{padding:10px}.relay-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.split{grid-template-columns:1fr}table{min-width:680px}}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 18px 45px rgba(15,23,42,.12)}.login-card h1{margin:0 0 8px;font-size:24px}.login-card p{margin:0 0 18px;color:var(--muted);font-weight:700}.login-card .field{margin-bottom:12px}.claim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="login" id="loginView"><form class="login-card" id="loginForm"><h1>autoControl 後端</h1><p>請登入後管理叢集與裝置。測試帳號：admin123 / admin123</p><div class="field"><label>帳號</label><input id="loginUser" autocomplete="username" value="admin123"></div><div class="field"><label>密碼</label><input id="loginPass" type="password" autocomplete="current-password" value="admin123"></div><button class="btn primary" type="submit" style="width:100%">登入</button></form></div>
<div class="app hidden" id="appView"><aside class="side"><div class="brand">autoControl Backend</div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="top-actions"><div class="sub" id="clock">--</div><button class="btn" onclick="logout()">登出</button></div></header><section class="content" id="content"></section></main></div><div class="toast" id="toast"></div>
<script>
"use strict";
const T={
  title:"\u7e3d\u89bd",overview:"\u7e3d\u89bd",relays:"\u7e7c\u96fb\u5668\u63a7\u5236",nodes:"\u7bc0\u9ede",protection:"\u4fdd\u8b77",scheduler:"\u6392\u7a0b\u5668",cloud:"\u96f2\u7aef/\u53e2\u96c6",keys:"\u91d1\u9470",events:"\u4e8b\u4ef6",
  search:"\u641c\u5c0b",refresh:"\u91cd\u65b0\u6574\u7406",online:"\u5728\u7dda",offline:"\u96e2\u7dda",unknown:"\u672a\u77e5",open:"\u958b\u555f",close:"\u95dc\u9589",on:"\u958b\u555f",off:"\u95dc\u9589",pending:"\u7b49\u5f85\u78ba\u8a8d",
  allOn:"\u5168\u90e8\u958b\u555f",allOff:"\u5168\u90e8\u95dc\u9589",nodeAllOn:"\u6b64\u7bc0\u9ede\u5168\u958b",nodeAllOff:"\u6b64\u7bc0\u9ede\u5168\u95dc",forceStop:"\u5f37\u5236\u505c\u6b62",shortStop:"\u5f37\u505c",unlock:"\u89e3\u9664\u9396\u5b9a",clearLearning:"\u6e05\u9664\u5b78\u7fd2",clearShort:"\u6e05\u5b78\u7fd2",
  nodeList:"\u7bc0\u9ede\u6e05\u55ae",relayState:"Relay",adc:"ADC/CT",lastSeen:"\u6700\u5f8c\u4e0a\u5831",action:"\u64cd\u4f5c",status:"\u72c0\u614b",role:"\u89d2\u8272",cluster:"\u53e2\u96c6",ip:"IP",control:"\u63a7\u5236",
  ctReady:"CT \u5c31\u7dd2",ctNotReady:"CT \u672a\u5c31\u7dd2",noNodes:"\u76ee\u524d\u6c92\u6709\u7bc0\u9ede\u3002\u5f8c\u7aef\u61c9\u8a72\u5f9e master \u7684 broker/status \u540c\u6b65 member\uff1b\u5982\u679c\u9019\u88e1\u7a7a\u767d\uff0c\u4ee3\u8868 broker \u6216 master \u4e0a\u5831\u908f\u8f2f\u672a\u5de5\u4f5c\u3002",
  backendSummary:"\u5f8c\u7aef\u6458\u8981",recentEvents:"\u6700\u8fd1\u4e8b\u4ef6",noData:"\u6c92\u6709\u8cc7\u6599",noEvents:"\u5c1a\u7121\u4e8b\u4ef6",noControlNodes:"\u6c92\u6709\u53ef\u63a7\u5236\u7684\u7bc0\u9ede\u3002",
  protectionOps:"\u4fdd\u8b77\u64cd\u4f5c",backendBrokerOnly:"\u5f8c\u7aef\u53ea\u8f49\u767c\u6307\u4ee4\u7d66 broker\uff1b\u5be6\u969b\u4fdd\u8b77\u5224\u65b7\u5728 MCU\u3002",channel:"\u901a\u9053",enable:"\u555f\u7528",pause1h:"\u66ab\u505c 1 \u5c0f\u6642",resume:"\u6062\u5fa9",
  schedulerHint:"\u9019\u88e1\u63d0\u4f9b\u5f8c\u7aef\u8f49\u767c\u63a7\u5236\u3002\u5b8c\u6574\u6392\u7a0b\u7de8\u8f2f\u4ecd\u5efa\u8b70\u5728 MCU \u9801\u9762\u64cd\u4f5c\uff1b\u5f8c\u7aef\u91cd\u9ede\u662f\u53ef\u4ee5\u5c0d member \u767c\u51fa enable/pause/resume\u3002",
  cloudDevices:"\u96f2\u7aef\u88dd\u7f6e",cloudClusters:"\u53e2\u96c6",apiKeys:"API \u91d1\u9470",createKey:"\u65b0\u589e\u91d1\u9470",keyName:"\u91d1\u9470\u540d\u7a31",created:"\u91d1\u9470\u5df2\u5efa\u7acb",updated:"\u5df2\u66f4\u65b0",loadFail:"\u521d\u59cb\u8f09\u5165\u5931\u6557",sseFallback:"SSE \u65b7\u7dda\uff0c\u6539\u7528\u8f2a\u8a62\u66f4\u65b0"
};
const PAGES=["overview","relays","nodes","protection","scheduler","cloud","keys","events"];
const state={summary:{},clients:[],nodes:[],cloudDevices:[],cloudClusters:[],keys:[],events:[],page:"overview",filter:"",selectedCluster:"",selectedNode:0,selectedChannel:1,loggedIn:false};
const relayCfg=new Map(),pending=new Map();let renderTimer=0;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function pill(text,cls){return `<span class="pill ${cls}">${esc(text)}</span>`;}
function roleText(r){return Number(r)===2?"Master":Number(r)===1?"Member":T.unknown;}
function onlinePill(n){return Number(n.online)?pill(T.online,"ok"):pill(T.offline,"off");}
function rolePill(n){return pill(roleText(n.role),Number(n.role)===2?"info":"off");}
function fmtTime(s){if(!s)return"-";const d=new Date(s);return Number.isNaN(d.getTime())?String(s):d.toLocaleString("zh-TW",{hour12:false});}
function deviceName(n){return String(n.device||n.cloudDeviceId||`Node ${n.nodeId||"-"}`);}
function nodeTitle(n){return `${deviceName(n)} - Node ${n.nodeId||"-"}`;}
function toast(msg,bad=false){const el=document.createElement("div");el.className=bad?"bad":"";el.textContent=msg;$("toast").appendChild(el);setTimeout(()=>el.remove(),2800);}
function pendingKey(n,ch,op="relay"){return `${op}:${Number(n)}:${Number(ch)}`;}function isPending(n,ch){return [...pending.keys()].some(k=>k.includes(`:${Number(n)}:${Number(ch)}`));}
async function api(path,opt={}){const headers=Object.assign({},opt.headers||{});if(opt.body&&typeof opt.body!=="string"){headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body);}const res=await fetch(path,Object.assign({credentials:"same-origin"},opt,{headers}));const text=await res.text();let data;try{data=text?JSON.parse(text):{};}catch(_){data={ok:false,error:text||`HTTP ${res.status}`};}if(res.status===401){showLogin();throw new Error("unauthorized");}if(!res.ok||data.ok===false)throw new Error(data.error||`HTTP ${res.status}`);return data;}
function showLogin(){state.loggedIn=false;$("loginView").classList.remove("hidden");$("appView").classList.add("hidden");}
function showApp(){state.loggedIn=true;$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");}
async function login(username,password){await api("/api/auth/login",{method:"POST",body:{username,password}});showApp();startApp();}
async function logout(){try{await api("/api/auth/logout",{method:"POST",body:{}});}catch(_){}showLogin();}
function applyPayload(p){state.summary=p.summary||state.summary;state.clients=(p.clients&&p.clients.clients)||p.clients||state.clients;state.nodes=(p.knownNodes&&p.knownNodes.nodes)||p.nodes||state.nodes;state.cloudDevices=(p.cloudDevices&&p.cloudDevices.devices)||p.cloudDevices||state.cloudDevices;state.cloudClusters=(p.cloudClusters&&p.cloudClusters.clusters)||p.cloudClusters||state.cloudClusters;state.events=(p.events&&p.events.events)||p.events||state.events;scheduleRender();}
function nodes(){const map=new Map();for(const n of state.nodes||[]){const id=Number(n.nodeId||0);if(id>0)map.set(String(id),Object.assign({},n));}for(const c of state.clients||[]){const id=Number(c.nodeId||0);if(id>0)map.set(String(id),Object.assign({},map.get(String(id))||{},c,{online:c.stale?0:1}));}for(const d of state.cloudDevices||[]){const id=Number(d.nodeId||0);if(id>0&&!map.has(String(id)))map.set(String(id),Object.assign({},d,{nodeId:id}));}return[...map.values()].sort((a,b)=>{const ca=String(a.cluster||a.clusterName||a.cloudClusterId||"");const cb=String(b.cluster||b.clusterName||b.cloudClusterId||"");return ca===cb?Number(a.nodeId||0)-Number(b.nodeId||0):ca.localeCompare(cb);});}
function nodeCluster(n){return String(n.cluster||n.clusterName||n.cloudClusterId||"default");}
function clusterOptions(){const set=new Set();for(const n of nodes())set.add(nodeCluster(n));for(const c of state.cloudClusters||[])set.add(String(c.clusterId||c.clusterName||"default"));return [...set].filter(Boolean).sort();}
function filteredNodes(){const q=state.filter.trim().toLowerCase();let list=nodes();if(state.selectedCluster)list=list.filter(n=>nodeCluster(n)===state.selectedCluster);if(!q)return list;return list.filter(n=>JSON.stringify(n).toLowerCase().includes(q));}
function relayName(n,ch){const cfg=relayCfg.get(String(n));const item=cfg&&cfg[ch-1];const name=item&&item.name?item.name:`CH${ch}`;return `${name} CH${ch}`;}
function normalizeRelayConfig(data){const raw=Array.isArray(data.relays)?data.relays:Array.isArray(data.channels)?data.channels:[];const out=Array.from({length:16},(_,i)=>({channel:i+1,name:`CH${i+1}`}));for(const r of raw){const ch=Number(r.channel||r.ch||r.index||0);if(ch>=1&&ch<=16)out[ch-1]=Object.assign({},out[ch-1],r,{name:String(r.name||r.label||`CH${ch}`)});}return out;}
async function loadRelayConfigFor(n){const key=String(n);if(relayCfg.has(key))return;relayCfg.set(key,Array.from({length:16},(_,i)=>({channel:i+1,name:`CH${i+1}`})));try{const data=await api(`/api/config/${encodeURIComponent(n)}/relays`);relayCfg.set(key,normalizeRelayConfig(data));scheduleRender();}catch(_){}}
async function refreshOnce(){const out=await Promise.allSettled([api("/api/summary"),api("/api/known-nodes"),api("/api/clients"),api("/api/cloud/devices"),api("/api/cloud/clusters"),api("/api/events"),api("/api/keys")]);const p={};if(out[0].status==="fulfilled")p.summary=out[0].value;if(out[1].status==="fulfilled")p.nodes=out[1].value.nodes||[];if(out[2].status==="fulfilled")p.clients=out[2].value.clients||[];if(out[3].status==="fulfilled")p.cloudDevices=out[3].value.devices||[];if(out[4].status==="fulfilled")p.cloudClusters=out[4].value.clusters||[];if(out[5].status==="fulfilled")p.events=out[5].value.events||[];if(out[6].status==="fulfilled")state.keys=out[6].value.keys||[];applyPayload(p);}
function connectStream(){try{const es=new EventSource("/api/stream");es.onmessage=ev=>{try{applyPayload(JSON.parse(ev.data));}catch(_){}};es.onerror=()=>{$("subtitle").textContent=T.sseFallback;};}catch(_){}}
function scheduleRender(){clearTimeout(renderTimer);renderTimer=setTimeout(render,60);}function setPage(page){state.page=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("title").textContent=T[page]||page;render();}
function toolbar(extra=""){const opts=clusterOptions();return `<div class="toolbar"><div class="field"><label>叢集</label><select id="clusterInput"><option value="">全部叢集</option>${opts.map(c=>`<option value="${esc(c)}" ${c===state.selectedCluster?"selected":""}>${esc(c)}</option>`).join("")}</select></div><div class="field" style="flex:1 1 260px"><label>${T.search}</label><input id="filterInput" value="${esc(state.filter)}" placeholder="Node ID / IP / cluster"></div><button class="btn primary" onclick="manualRefresh()">${T.refresh}</button>${extra}</div>`;}function bindFilter(){const el=$("filterInput");if(el)el.oninput=()=>{state.filter=el.value;scheduleRender();};const ce=$("clusterInput");if(ce)ce.onchange=()=>{state.selectedCluster=ce.value;scheduleRender();};}
function render(){ $("subtitle").textContent=`Nodes ${nodes().length}, Broker clients ${state.clients.length}, ${new Date().toLocaleTimeString("zh-TW",{hour12:false})}`; const p=state.page; if(p==="overview")return renderOverview(); if(p==="relays")return renderRelays(); if(p==="nodes")return renderNodes(); if(p==="protection")return renderProtection(); if(p==="scheduler")return renderScheduler(); if(p==="cloud")return renderCloud(); if(p==="keys")return renderKeys(); if(p==="events")return renderEvents();}
function renderOverview(){const s=state.summary||{};const online=nodes().filter(n=>Number(n.online)).length;$("content").innerHTML=`<div class="grid"><div class="metric"><b>${online}/${nodes().length}</b><span>${T.online} ${T.nodes}</span></div><div class="metric"><b>${state.clients.length}</b><span>Broker clients</span></div><div class="metric"><b>${state.cloudDevices.length}</b><span>${T.cloudDevices}</span></div><div class="metric"><b>${state.cloudClusters.length}</b><span>${T.cloudClusters}</span></div><div class="metric"><b>${s.keyCount??state.keys.length}</b><span>${T.keys}</span></div></div><div class="panel"><div class="panel-h"><h2>${T.nodeList}</h2><button class="btn" onclick="setPage('relays')">${T.control}</button></div><div class="table-wrap">${nodeTable(nodes())}</div></div><div class="split"><div class="panel"><div class="panel-h"><h2>${T.backendSummary}</h2></div><div class="panel-b"><pre>${esc(JSON.stringify(s,null,2))}</pre></div></div><div class="panel"><div class="panel-h"><h2>${T.recentEvents}</h2></div><div class="panel-b">${eventsList(12)}</div></div></div>`;}
function nodeTable(list){if(!list.length)return`<div class="empty">${T.noNodes}</div>`;return`<table><thead><tr><th>${T.nodes}</th><th>${T.status}</th><th>${T.role}</th><th>${T.cluster}</th><th>${T.ip}</th><th>${T.relayState}</th><th>${T.lastSeen}</th><th>${T.action}</th></tr></thead><tbody>${list.map(n=>`<tr><td><b>${esc(deviceName(n))}</b><br><span class="muted mono">${esc(n.nodeId)}</span></td><td>${onlinePill(n)}</td><td>${rolePill(n)}</td><td>${esc(n.cluster||n.clusterName||n.cloudClusterId||"-")}</td><td class="mono">${esc(n.ip||"-")}</td><td class="mono">0x${(Number(n.relayMask||0)>>>0).toString(16).padStart(4,"0")}</td><td>${esc(fmtTime(n.lastSeenAt||n.lastMessageAt))}</td><td class="actions"><button class="btn" onclick="focusRelay(${Number(n.nodeId)})">${T.control}</button></td></tr>`).join("")}</tbody></table>`;}
function renderNodes(){$("content").innerHTML=toolbar()+`<div class="panel"><div class="panel-h"><h2>${T.nodeList}</h2></div><div class="table-wrap">${nodeTable(filteredNodes())}</div></div>`;bindFilter();}
function renderRelays(){const list=filteredNodes();for(const n of list)if(Number(n.nodeId)>0)void loadRelayConfigFor(Number(n.nodeId));$("content").innerHTML=toolbar(`<button class="btn green" onclick="bulkAll(1)">${T.allOn}</button><button class="btn red" onclick="bulkAll(0)">${T.allOff}</button>`)+(list.length?list.map(renderNodeRelays).join(""):`<div class="panel"><div class="empty">${T.noControlNodes}</div></div>`);bindFilter();}
function renderNodeRelays(n){const mask=Number(n.relayMask||0)>>>0;return`<section class="node"><div class="node-head"><div><div class="node-title">${esc(nodeTitle(n))}</div><div class="muted">IP ${esc(n.ip||"-")} - ${T.cluster} ${esc(n.cluster||n.cloudClusterId||"-")}</div></div><div class="node-meta">${onlinePill(n)} ${rolePill(n)} ${pill(`Relay 0x${mask.toString(16).padStart(4,"0")}`,"info")}<button class="btn green" onclick="sendAll(${Number(n.nodeId)},1)" ${Number(n.online)?"":"disabled"}>${T.nodeAllOn}</button><button class="btn red" onclick="sendAll(${Number(n.nodeId)},0)" ${Number(n.online)?"":"disabled"}>${T.nodeAllOff}</button></div></div><div class="relay-grid">${Array.from({length:16},(_,i)=>renderRelayCard(n,i+1,!!(mask&(1<<i)))).join("")}</div></section>`;}
function renderRelayCard(n,ch,on){const p=isPending(n.nodeId,ch);const disabled=!Number(n.online)||p;return`<article class="relay ${on?"on":"off"} ${p?"pending":""}"><h3>${esc(relayName(n.nodeId,ch))}</h3><div>${on?pill(T.on,"ok"):pill(T.off,"off")} ${p?pill(T.pending,"pending"):""}</div><div class="muted">Node ${esc(n.nodeId)} - CH${ch}</div><div class="muted">${Number(n.adcCtValid)?`${Number(n.adcCurrentMilliamps||0)} mA`:T.ctNotReady}</div><div class="relay-actions"><button class="btn ${on?"orange":"green"}" onclick="sendRelay(${Number(n.nodeId)},${ch},${on?0:1})" ${disabled?"disabled":""}>${on?T.close:T.open}</button><button class="btn red" onclick="forceStop(${Number(n.nodeId)},${ch})" ${Number(n.online)?"":"disabled"}>${T.shortStop}</button><button class="btn" onclick="clearLearning(${Number(n.nodeId)},${ch})" ${Number(n.online)?"":"disabled"}>${T.clearShort}</button></div></article>`;}
function optimisticMask(n,ch,value){for(const node of state.nodes){if(Number(node.nodeId)===Number(n)){const bit=1<<(ch-1);node.relayMask=value?((Number(node.relayMask||0)>>>0)|bit):((Number(node.relayMask||0)>>>0)&~bit);}}}
async function sendRelay(n,ch,value){const key=pendingKey(n,ch);pending.set(key,Date.now());optimisticMask(n,ch,value);render();try{await api(`/send/${encodeURIComponent(n)}/relay`,{method:"POST",body:{channel:ch,value,targetNodeId:n}});toast(`Node ${n} CH${ch} OK`);}catch(e){toast(`relay failed: ${e.message}`,true);}finally{setTimeout(()=>{pending.delete(key);scheduleRender();},1600);}}
async function sendAll(n,value){for(let ch=1;ch<=16;ch++)pending.set(pendingKey(n,ch),Date.now());const node=nodes().find(x=>Number(x.nodeId)===Number(n));if(node)node.relayMask=value?0xffff:0;render();try{await api(`/send/${encodeURIComponent(n)}/all`,{method:"POST",body:{value,targetNodeId:n}});toast(`Node ${n} OK`);}catch(e){toast(`all failed: ${e.message}`,true);}finally{setTimeout(()=>{for(let ch=1;ch<=16;ch++)pending.delete(pendingKey(n,ch));scheduleRender();},1800);}}
async function bulkAll(value){for(const n of filteredNodes().filter(x=>Number(x.online)))await sendAll(Number(n.nodeId),value);}
async function forceStop(n,ch){try{optimisticMask(n,ch,0);render();await api(`/send/${encodeURIComponent(n)}/protection/force-stop`,{method:"POST",body:{channel:ch,targetNodeId:n}});toast(`Node ${n} CH${ch} ${T.forceStop}`);}catch(e){toast(`force stop failed: ${e.message}`,true);}}
async function unlock(n,ch){try{await api(`/send/${encodeURIComponent(n)}/protection/unlock`,{method:"POST",body:{channel:ch,targetNodeId:n}});toast(`Node ${n} CH${ch} ${T.unlock}`);}catch(e){toast(`unlock failed: ${e.message}`,true);}}
async function clearLearning(n,ch){try{await api(`/send/${encodeURIComponent(n)}/protection/clear-learning`,{method:"POST",body:{channel:ch,targetNodeId:n}});toast(`Node ${n} CH${ch} ${T.clearLearning}`);}catch(e){toast(`clear learning failed: ${e.message}`,true);}}
function renderProtection(){const rows=[];for(const n of filteredNodes())for(let ch=1;ch<=16;ch++)rows.push({n,ch});$("content").innerHTML=toolbar()+`<div class="panel"><div class="panel-h"><h2>${T.protectionOps}</h2><span class="muted">${T.backendBrokerOnly}</span></div><div class="table-wrap"><table><thead><tr><th>${T.nodes}</th><th>CH</th><th>${T.status}</th><th>${T.adc}</th><th>${T.action}</th></tr></thead><tbody>${rows.map(({n,ch})=>`<tr><td><b>${esc(deviceName(n))}</b><br><span class="mono muted">${esc(n.nodeId)}</span></td><td>${esc(relayName(n.nodeId,ch))}</td><td>${onlinePill(n)} ${rolePill(n)}</td><td>${Number(n.adcCtValid)?pill(T.ctReady,"ok"):pill(T.ctNotReady,"warn")} ${Number(n.adcCurrentMilliamps||0)} mA</td><td class="actions"><button class="btn red" onclick="forceStop(${Number(n.nodeId)},${ch})" ${Number(n.online)?"":"disabled"}>${T.forceStop}</button><button class="btn" onclick="unlock(${Number(n.nodeId)},${ch})" ${Number(n.online)?"":"disabled"}>${T.unlock}</button><button class="btn" onclick="clearLearning(${Number(n.nodeId)},${ch})" ${Number(n.online)?"":"disabled"}>${T.clearLearning}</button></td></tr>`).join("")}</tbody></table></div></div>`;bindFilter();}
function renderScheduler(){const list=filteredNodes();if(!state.selectedNode&&list[0])state.selectedNode=Number(list[0].nodeId);$("content").innerHTML=toolbar(`<div class="field"><label>${T.nodes}</label><select id="schedNode">${list.map(n=>`<option value="${esc(n.nodeId)}" ${Number(n.nodeId)===Number(state.selectedNode)?"selected":""}>${esc(nodeTitle(n))}</option>`).join("")}</select></div><div class="field"><label>${T.channel}</label><select id="schedCh">${Array.from({length:16},(_,i)=>`<option value="${i+1}" ${i+1===Number(state.selectedChannel)?"selected":""}>CH${i+1}</option>`).join("")}</select></div><button class="btn green" onclick="schedulerEnabled(1)">${T.enable}</button><button class="btn orange" onclick="schedulerPause()">${T.pause1h}</button><button class="btn blue" onclick="schedulerResume()">${T.resume}</button>`)+`<div class="panel"><div class="panel-h"><h2>${T.scheduler}</h2></div><div class="panel-b"><p class="muted">${T.schedulerHint}</p></div></div>`;bindFilter();const sn=$("schedNode"),sc=$("schedCh");if(sn)sn.onchange=()=>{state.selectedNode=Number(sn.value);};if(sc)sc.onchange=()=>{state.selectedChannel=Number(sc.value);};}
async function schedulerEnabled(enabled){try{await api(`/send/${encodeURIComponent(state.selectedNode)}/scheduler/enabled`,{method:"POST",body:{channel:state.selectedChannel,enabled,targetNodeId:state.selectedNode}});toast("scheduler OK");}catch(e){toast(`scheduler failed: ${e.message}`,true);}}
async function schedulerPause(){try{await api(`/send/${encodeURIComponent(state.selectedNode)}/scheduler/pause`,{method:"POST",body:{channel:state.selectedChannel,mode:1,duration_seconds:3600,targetNodeId:state.selectedNode}});toast("scheduler pause OK");}catch(e){toast(`pause failed: ${e.message}`,true);}}
async function schedulerResume(){try{await api(`/send/${encodeURIComponent(state.selectedNode)}/scheduler/resume`,{method:"POST",body:{channel:state.selectedChannel,targetNodeId:state.selectedNode}});toast("scheduler resume OK");}catch(e){toast(`resume failed: ${e.message}`,true);}}
function simpleTable(list,cols){if(!Array.isArray(list)||!list.length)return`<div class="empty">${T.noData}</div>`;return`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${list.map(row=>`<tr>${cols.map(c=>`<td>${typeof row[c]==="object"?`<code>${esc(JSON.stringify(row[c]))}</code>`:esc(row[c]??"-")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;}
function cloudDevicesTable(){const list=state.cloudDevices||[];if(!list.length)return`<div class="empty">${T.noData}</div>`;return`<table><thead><tr><th>deviceId</th><th>nodeId</th><th>device</th><th>clusterId</th><th>online</th><th>fingerprint</th><th>${T.action}</th></tr></thead><tbody>${list.map(d=>`<tr><td class="mono">${esc(d.deviceId||"-")}</td><td>${esc(d.nodeId??"-")}</td><td>${esc(d.device||"-")}</td><td>${esc(d.clusterId||"-")}</td><td>${Number(d.online)?pill(T.online,"ok"):pill(T.offline,"off")}</td><td>${d.mcuDeviceFingerprint||d.fingerprintBoundAt?pill("MCU bound","ok"):pill("not bound","warn")}</td><td class="actions"><button class="btn orange" onclick="resetDeviceFingerprint('${esc(d.clusterId||"")}','${esc(d.deviceId||"")}')">Reset fingerprint</button></td></tr>`).join("")}</tbody></table>`;}
function renderCloud(){$("content").innerHTML=`<div class="panel"><div class="panel-h"><h2>認領裝置</h2><span class="muted">測試版：輸入 node_id 後建立雲端裝置紀錄；正式版建議改為簽章認領。</span></div><div class="panel-b"><div class="claim-grid"><div class="field"><label>叢集 ID</label><input id="claimCluster" value="${esc(state.selectedCluster||"default")}"></div><div class="field"><label>Node ID</label><input id="claimNode" placeholder="例如 579948958"></div><div class="field"><label>Device ID</label><input id="claimDevice" placeholder="空白時使用 node-<node_id>"></div><div class="field"><label>顯示名稱</label><input id="claimName" placeholder="例如 客廳控制箱"></div><button class="btn primary" onclick="claimNode()">認領 / 建立</button></div></div></div><div class="split"><div class="panel"><div class="panel-h"><h2>${T.cloudDevices}</h2></div><div class="table-wrap">${cloudDevicesTable()}</div></div><div class="panel"><div class="panel-h"><h2>${T.cloudClusters}</h2></div><div class="table-wrap">${simpleTable(state.cloudClusters,["clusterId","clusterName","enabled","onlineDevices","knownDevices","lastMasterNodeId"])}</div></div></div>`;}
async function claimNode(){const nodeId=Number(($("claimNode")||{}).value||0);const clusterId=String(($("claimCluster")||{}).value||"default").trim()||"default";const deviceId=String(($("claimDevice")||{}).value||"").trim();const deviceName=String(($("claimName")||{}).value||"").trim();if(!nodeId){toast("請輸入 Node ID",true);return;}try{const body={clusterId,nodeId};if(deviceId)body.deviceId=deviceId;if(deviceName)body.deviceName=deviceName;const data=await api("/api/cloud/claim-node",{method:"POST",body});state.selectedCluster=clusterId;await manualRefresh();toast(`已認領 ${data.device?.deviceId||nodeId}`);}catch(e){toast(`認領失敗: ${e.message}`,true);}}
async function resetDeviceFingerprint(clusterId,deviceId){if(!clusterId||!deviceId)return;if(!confirm("Reset MCU fingerprint binding for "+deviceId+"?"))return;try{await api(`/api/cloud/devices/${encodeURIComponent(clusterId)}/${encodeURIComponent(deviceId)}/reset-fingerprint`,{method:"POST",body:{}});await manualRefresh();toast("fingerprint reset");}catch(e){toast(`reset failed: ${e.message}`,true);}}
function renderKeys(){$("content").innerHTML=`<div class="toolbar"><button class="btn primary" onclick="createKey()">${T.createKey}</button><button class="btn" onclick="manualRefresh()">${T.refresh}</button></div><div class="panel"><div class="panel-h"><h2>${T.apiKeys}</h2></div><div class="table-wrap">${simpleTable(state.keys,["id","label","enabled","createdAt","lastUsedAt"])}</div></div>`;}
async function createKey(){const label=prompt(T.keyName,"backend-key");if(!label)return;try{await api("/api/keys",{method:"POST",body:{label}});await manualRefresh();toast(T.created);}catch(e){toast(`key failed: ${e.message}`,true);}}
function renderEvents(){$("content").innerHTML=`<div class="toolbar"><button class="btn" onclick="manualRefresh()">${T.refresh}</button></div><div class="panel"><div class="panel-h"><h2>${T.events}</h2></div><div class="panel-b">${eventsList(80)}</div></div>`;}
function eventsList(limit){const evs=(state.events||[]).slice(-limit).reverse();if(!evs.length)return`<div class="empty">${T.noEvents}</div>`;return`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Type</th><th>Payload</th></tr></thead><tbody>${evs.map(e=>`<tr><td>${esc(fmtTime(e.ts||e.time||e.at))}</td><td>${esc(e.type||e.event||"-")}</td><td><code>${esc(JSON.stringify(e.payload||e.data||e))}</code></td></tr>`).join("")}</tbody></table></div>`;}
function focusRelay(n){state.filter=String(n);setPage("relays");}async function manualRefresh(){try{await refreshOnce();toast(T.updated);}catch(e){toast(`refresh failed: ${e.message}`,true);}}
function initNav(){const nav=$("nav");nav.innerHTML=PAGES.map(p=>`<button class="${p===state.page?"active":""}" data-page="${p}">${T[p]}</button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));$("title").textContent=T[state.page];}
let appStarted=false;
function startApp(){if(appStarted)return;appStarted=true;initNav();setInterval(()=>{$("clock").textContent=new Date().toLocaleString("zh-TW",{hour12:false});},1000);setInterval(()=>refreshOnce().catch(()=>{}),15000);connectStream();refreshOnce().catch(e=>toast(`${T.loadFail}: ${e.message}`,true));render();}
$("loginForm").addEventListener("submit",async(ev)=>{ev.preventDefault();try{await login($("loginUser").value,$("loginPass").value);}catch(e){toast(`登入失敗: ${e.message}`,true);}});
api("/api/auth/session").then(()=>{showApp();startApp();}).catch(()=>showLogin());
</script>
</body>
</html>
