<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>autoControl</title>
<style>
:root{--p:#0891b2;--ph:#0e7490;--d:#e11d48;--g:#16a34a;--w:#ea580c;--bg:#f1f5f9;--c:#fff;--b:#e2e8f0;--t:#0f172a;--m:#64748b;--fs:1.5rem}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--t);font-size:var(--fs);line-height:1.5}
.topbar{background:linear-gradient(135deg,var(--p),var(--ph));color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:1.8rem;font-weight:700}
.topbar .info{font-size:1rem;opacity:.9}
nav{display:flex;gap:2px;background:var(--c);border-bottom:1px solid var(--b);padding:0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:54px;z-index:99}
nav button{flex-shrink:0;border:0;background:none;padding:16px 22px;font-size:1.1rem;font-weight:600;color:var(--m);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:var(--p);border-bottom-color:var(--p)}
main{padding:16px;max-width:1400px;margin:0 auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{font-size:1.5rem;margin-bottom:14px;color:var(--t)}
.grid-relay{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.relay-card{border:2px solid var(--b);border-radius:12px;padding:16px;background:#fafcfd;display:flex;flex-direction:column;min-height:220px}
.relay-card .rname{font-weight:700;font-size:1.15rem;margin-bottom:4px;word-break:break-word}
.relay-card .rstate{font-size:1rem;font-weight:600;margin-bottom:2px}
.relay-card .radc{font-size:1rem;color:var(--m);font-weight:600;margin-bottom:8px}
.relay-card .rbtns{display:flex;gap:8px;margin-top:auto;align-items:center;justify-content:space-between;min-height:44px;padding-top:10px}
.relay-card .rbtns>button:first-child,.relay-card .rbtns .main-action{min-width:92px;justify-content:center}
.relay-card .rbtns .right{display:flex;gap:4px;margin-left:auto;align-items:center}
.relay-card.on{border-left:4px solid var(--g);background:#f0fdf4}
.relay-card.off{border-left:4px solid #cbd5e1}
.relay-card.locked{border-left:4px solid var(--d);background:#fff5f5}
.relay-card.pending{opacity:.72;background:#f8fafc;filter:saturate(.65)}
.rsched{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 8px;min-height:28px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.dot.on{background:var(--g)}.dot.off{background:#cbd5e1}.dot.locked{background:var(--d)}
.btn{border:0;border-radius:8px;padding:10px 18px;font-size:1.08rem;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;justify-content:center;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--p);color:#fff}.btn-sec{background:#e2e8f0;color:var(--t)}
.btn-dan{background:var(--d);color:#fff}.btn-ok{background:var(--g);color:#fff}
.btn-warn{background:var(--w);color:#fff}
.btn-sm{padding:7px 12px;font-size:.95rem;min-height:40px}.btn-lg{padding:12px 24px;font-size:1.18rem}
.btn-force{background:#b91c1c;color:#fff;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(185,28,28,.4)}50%{box-shadow:0 0 0 6px rgba(185,28,28,0)}}
table{width:100%;border-collapse:collapse;font-size:1rem}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--b);vertical-align:top}
th{color:var(--m);font-weight:600;white-space:nowrap}
.pill{display:inline-block;padding:5px 11px;border-radius:99px;font-size:.85rem;font-weight:700}
.pill-on{background:#dcfce7;color:#166534}.pill-off{background:#f1f5f9;color:#475569}
.pill-lock{background:#fecaca;color:#991b1b}.pill-info{background:#dbeafe;color:#1e40af}
.pill-master{background:#dbeafe;color:#1e40af}.pill-member{background:#f1f5f9;color:#475569}
.pill-warn{background:#fef3c7;color:#92400e}
.pill-pending{background:#e0e7ff;color:#3730a3}
.node-section{margin-bottom:16px;border:2px solid var(--b);border-radius:12px;overflow:hidden}
.node-section .nhead{padding:14px 18px;background:#f8fafc;border-bottom:2px solid var(--b);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:1.1rem}
.node-section .nhead .ntitle{font-weight:700;font-size:1.15rem}
.node-section .nhead .nmeta{font-size:.9rem;color:var(--m);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.node-section .nbody{padding:14px}
.master-banner{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border:2px solid #60a5fa;border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:1.1rem}
.master-banner .mtxt{font-weight:700;color:#1e40af}
code{font-family:monospace;font-size:.85rem;background:#f1f5f9;padding:3px 7px;border-radius:5px;word-break:break-all}
input,select{font:inherit;font-size:1.06rem;border:1px solid var(--b);border-radius:8px;padding:10px 12px;background:var(--c);width:100%}
input[type=radio],input[type=checkbox]{width:auto;padding:0}
label{font-size:.9rem;color:var(--m);display:block;margin-bottom:5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 180px}
pre{background:#1e293b;color:#cbd5e1;padding:12px;border-radius:10px;font-size:.8rem;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-word}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:12px}
.modal>div{background:var(--c);border-radius:14px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#relayCfgModal>div{overflow:visible;max-height:none}
.modal h3{font-size:1.3rem;margin-bottom:14px}
.modal label{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:1rem}
.info-tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#e0f2fe;color:#0369a1;font-size:.78rem;font-weight:900;cursor:help;vertical-align:middle;flex:0 0 auto}
.field-label{display:flex;align-items:center;gap:6px;color:var(--m);font-size:1rem;margin-bottom:5px}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.learn-box{font-size:.92rem;line-height:1.65;color:var(--m)}
.modal label input[type=datetime-local]{width:auto}
.sch-day-bar{display:flex;gap:4px;align-items:center;margin-bottom:5px;flex-wrap:nowrap}
.sch-day-bar .day{font-weight:700;font-size:1rem;width:42px;text-align:right;flex-shrink:0}
.sch-day-bar .bar{flex:1;height:30px;background:#e2e8f0;border-radius:4px;position:relative;min-width:100px;overflow:hidden}
.sch-day-bar .bar .seg{position:absolute;height:100%;background:var(--p);border-radius:4px;cursor:pointer;transition:opacity .15s}
.sch-day-bar .bar .seg:hover{opacity:.8}
.sch-day-bar .times{font-size:.72rem;color:var(--m);white-space:nowrap;min-width:120px;flex-shrink:0}
.sch-week{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sch-day-card{border:1px solid var(--b);border-radius:12px;padding:12px;background:#fff}
.sch-day-card .day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sch-day-card .day-title{font-weight:800;font-size:1.05rem}
.sch-day-card .day-actions{display:flex;gap:6px;flex-wrap:wrap}
.sch-intervals{display:flex;flex-direction:column;gap:6px}
.sch-interval{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--b);border-radius:10px;padding:8px 10px;background:#f8fafc}
.sch-interval.pending,.sch-day-card.pending,.copy-week-item.pending{opacity:.55;pointer-events:none;filter:saturate(.55)}
.sch-interval .time{font-weight:800;white-space:nowrap}
.sch-interval .hint{font-size:.82rem;color:var(--m)}
.sch-empty{color:var(--m);font-size:.95rem;padding:8px 0}
.msg{padding:12px 16px;border-radius:10px;font-size:1rem;font-weight:600;margin-bottom:10px}
.msg-ok{background:#dcfce7;color:#166534}.msg-err{background:#fecaca;color:#991b1b}
.msg-info{background:#dbeafe;color:#1e40af}
.hint{font-size:.95rem;color:var(--m);line-height:1.6}
.hint-panel{background:#dbeafe;color:#1e40af;border-radius:10px;padding:10px 14px;font-size:.95rem;line-height:1.65;margin:8px 0 12px}
.settings-row{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:12px;align-items:end;margin-bottom:10px}
.settings-row .btn{width:64px;padding-left:0;padding-right:0}
.checkline{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--t);cursor:pointer;margin:0}
.checkline input[type=checkbox]{width:18px;height:18px;flex:0 0 auto}
.chk-group{display:flex;gap:8px;flex-wrap:wrap}
.chk-group label{display:flex;align-items:center;gap:4px;font-size:.9rem;color:var(--t)}
.chk-group label input{width:auto}
.copy-week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.copy-week-item{border:1px solid var(--b);border-radius:10px;background:#f8fafc;padding:10px;display:flex;align-items:center;gap:8px;color:var(--t);font-weight:700}
.copy-week-item input{width:auto}
.scheduler-head{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.15fr);gap:14px;align-items:end;margin-bottom:10px}
.scheduler-head>div{min-width:0}
.sch-status-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.sch-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.info-tip[title]:hover::after{content:attr(title);position:absolute;z-index:500;background:#0f172a;color:#fff;border-radius:8px;padding:8px 10px;font-size:.85rem;line-height:1.4;min-width:180px;max-width:260px;transform:translateY(-120%);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hidden{display:none!important}
@media(min-width:768px){main{padding:24px}.grid-relay{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.relay-card{padding:20px}nav button{padding:18px 26px;font-size:1.15rem}}
@media(min-width:1024px){.grid-relay{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
@media(max-width:767px){
  .scheduler-head{grid-template-columns:1fr}.sch-actions .btn{flex:1 1 140px}
  main{padding:12px}.card{padding:14px}.topbar{position:relative}.topbar h1{font-size:1.55rem}nav{top:0}
  .settings-row{grid-template-columns:1fr}.settings-row .btn{width:100%}
  .mobile-card-table table,.mobile-card-table tbody,.mobile-card-table tr,.mobile-card-table td{display:block;width:100%}
  .mobile-card-table thead,.mobile-card-table th{display:none}
  .mobile-card-table tr{border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff}
  .mobile-card-table td{border:0;padding:6px 2px;display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;word-break:break-word}
  .mobile-card-table td::before{content:attr(data-label);font-weight:700;color:var(--m)}
  .mobile-card-table td .row{gap:6px}
  .mobile-card-table td .btn{min-height:38px;padding:7px 10px;font-size:.95rem}
  .mobile-card-table td[data-label="操作"]{display:block;padding-top:10px}
  .mobile-card-table td[data-label="操作"]::before{display:block;margin-bottom:6px}
  .mobile-card-table td[data-label="操作"].row{display:grid;grid-template-columns:1fr;gap:8px;align-items:stretch}
  .mobile-card-table td[data-label="操作"] .btn{width:100%;min-width:0;margin:0;white-space:nowrap}
  .mobile-card-table td[data-label="操作"] .btn:last-child:nth-child(odd){grid-column:auto}
}
</style>
</head>
<body>
<div class="topbar"><h1>autoControl</h1><span class="info" id="deviceInfo">載入中...</span></div>
<nav id="tabNav">
<button data-tab="dashboard" class="active">儀表板</button>
<button data-tab="scheduler">排程器</button>
<button data-tab="cluster">叢集</button>
<button data-tab="protection">保護</button>
<button data-tab="settings">設定</button>
</nav>
<main id="main"></main>

<div id="loginModal" class="modal hidden">
<div><h3>登入</h3>
<div class="row" style="margin-bottom:10px"><input id="loginPwd" type="password" placeholder="請輸入密碼"></div>
<div class="row"><button class="btn btn-pri" onclick="doLogin()">登入</button><span id="loginMsg" style="font-size:.95rem;color:var(--d)"></span></div>
</div></div>

<div id="relayCfgModal" class="modal hidden">
<div><h3 id="relayCfgTitle">CH 設定</h3><div id="relayCfgBody"></div>
<div class="row" style="margin-top:12px"><button class="btn btn-pri" onclick="saveRelayCfg()">保存</button><button class="btn btn-sec" onclick="closeModal('relayCfgModal')">取消</button><span id="relayCfgMsg"></span></div>
</div></div>

<div id="pauseModal" class="modal hidden">
<div><h3>暫停排程器 — <span id="pauseCh"></span></h3>
<div style="margin-bottom:10px">
<label><input type="radio" name="pauseMode" value="segment" checked> 暫停到目前排程區間結束後 1 分鐘</label>
<label><input type="radio" name="pauseMode" value="1hr"> 暫停 1 小時</label>
<label><input type="radio" name="pauseMode" value="1day"> 暫停 1 天</label>
<label><input type="radio" name="pauseMode" value="custom"> 暫停到 <input id="pauseCustom" type="datetime-local" style="width:auto;margin-left:6px"></label>
<label><input type="radio" name="pauseMode" value="forever"> 停用排程</label>
</div>
<label style="margin-bottom:10px"><input type="checkbox" id="pauseBlockAuto"> 同時阻擋 Auto Hold 自動觸發</label>
<div class="row"><button class="btn btn-pri" onclick="doPause()">確認暫停</button><button class="btn btn-sec" onclick="closeModal('pauseModal')">取消</button></div>
</div></div>

<div id="controlPauseModal" class="modal hidden">
<div><h3>排程器正在管理 <span id="controlPauseCh"></span></h3>
<div class="msg msg-info">手動開關會暫停或停用這一路排程，請選擇處理方式。</div>
<div style="margin-bottom:10px">
<label><input type="radio" name="controlPauseMode" value="segment" checked> 暫停到目前排程區間結束後 1 分鐘</label>
<label><input type="radio" name="controlPauseMode" value="1hr"> 暫停 1 小時</label>
<label><input type="radio" name="controlPauseMode" value="1day"> 暫停 1 天</label>
<label><input type="radio" name="controlPauseMode" value="custom"> 暫停到 <input id="controlPauseCustom" type="datetime-local" style="width:auto;margin-left:6px"></label>
<label><input type="radio" name="controlPauseMode" value="disable"> 停用排程</label>
</div>
<label style="margin-bottom:10px"><input type="checkbox" id="controlPauseBlockAuto"> 同時阻擋 Auto Hold 自動觸發</label>
<div class="row"><button class="btn btn-pri" onclick="resolveControlPause(1)">套用並控制</button><button class="btn btn-sec" onclick="resolveControlPause(0)">取消</button></div>
</div></div>

<div id="schEditModal" class="modal hidden">
<div><h3 id="schEditTitle">編輯排程</h3><div id="schEditBody"></div>
<div class="row" style="margin-top:12px"><button class="btn btn-pri" onclick="saveSchInterval()">保存</button><button class="btn btn-dan btn-sm" onclick="delSchInterval()">刪除</button><button class="btn btn-sec" onclick="closeModal('schEditModal')">取消</button></div>
</div></div>

<div id="schCopyModal" class="modal hidden">
<div><h3 id="schCopyTitle">複製排程</h3><div id="schCopyBody"></div>
<div class="row" style="margin-top:12px"><button class="btn btn-pri" onclick="doCopyDay()">複製</button><button class="btn btn-sec" onclick="closeModal('schCopyModal')">取消</button></div>
</div></div>

<div id="schCopyWeekModal" class="modal hidden">
<div><h3>複製整週排程到其他 CH</h3><div id="schCopyWeekBody"></div>
<div class="row" style="margin-top:12px"><button class="btn btn-pri" onclick="doCopyWeek()">複製整週</button><button class="btn btn-sec" onclick="closeModal('schCopyWeekModal')">取消</button></div>
</div></div>

<div id="schedulerStatusModal" class="modal hidden">
<div><h3 id="schedulerStatusTitle">排程狀態</h3>
<div id="schedulerStatusBody"></div>
<div class="row" style="margin-top:12px">
<button class="btn btn-pri" onclick="resumeSchedulerFromInfo()">恢復排程</button>
<button class="btn btn-sec" onclick="closeModal('schedulerStatusModal')">關閉</button>
</div>
</div></div>

<script>
// ?? State ??
let TOKEN='',RELAYS={},SCH={},NODES=[],PROT={status:{},config:{}},DEV={},CLUSTER_NODES=[],RELAY_CFG_BY_NODE={},RELAY_SCHED_BY_NODE={},RELAY_PROT_BY_NODE={},RELAY_PROT_LAST_MS={};
let curTab='dashboard',curSchCh=1,curEditWd=-1,curEditIdx=-1,curCopyWd=-1,_pauseCh=1,_selNodeId=0;
let _myRole=0,_myNodeId=0,_pwd='';
let RELAY_PENDING={};
let _controlPauseResolve=null;
let _schedInfoNode=0,_schedInfoCh=0;
let LIVE_REFRESH_BUSY=false;
const LIVE_REFRESH_MS=5000;
let VIEW_SEQ=0,DEV_TIME_BASE_UNIX=0,DEV_TIME_BASE_MS=0;
const WEEK_DAYS=['週一','週二','週三','週四','週五','週六','週日'];
const days=WEEK_DAYS;
const DEFAULT_DEVICE_NAME='autoControl';
const DEFAULT_CLUSTER_NAME='default';
const DEFAULT_BROKER_HOST='mqtt.autocontrol.du1217.club';
const DEFAULT_BROKER_PORT=8883;

// ?? Normalize nested API responses ??
function normalizeStatus(s){
  const c=s&&s.cluster||{};const r=s&&s.rtos||{};
  return{
    role:Number(c.role||s.role||0),
    nodeId:Number(c.self_node_id||s.node_id||0),
    masterNodeId:Number(c.master_node_id||0),
    clusterName:c.name||s.cluster_name||'',
    deviceName:s.device_name||'',
    unixTime:Number(c.unix_time||s.unix_time||0),
    uptimeMs:Number(s.uptime_ms||0),
    heapFree:Number(r.heap_free||s.free_heap||0),
    relayMask:Number(s.relay_mask||0),
    version:s.version||'',
    cloudClusterId:s.cloud_cluster_id||'',
    cloudDeviceId:s.cloud_device_id||''
  };
}
function normalizeProtection(prot){
  const map={};
  const list=Array.isArray(prot&&prot.channels)?prot.channels:[];
  for(const item of list){
    const ch=Number(item.ch||item.channel);
    map[ch]={
      locked:!!item.fault_locked||!!item.tripped||!!item.locked,
      forceStop:!!item.force_stop,
      tripped:!!item.tripped,
      faultType:item.fault_reason||item.fault_type||0,
      faultReason:item.fault_reason||item.fault_type||0,
      faultLevel:Number(item.fault_level||0),
      retryCount:Number(item.retry_count||item.trip_count||0),
      currentMa:Number(item.current_ma||item.adc_current_ma||0),
      strategy:Number(item.device_strategy||item.strategy||0),
      protectionEnabled:!!item.protection_enabled,
      referenceMa:Number(item.reference_ma||0),
      baselineMa:Number(item.baseline_ma||item.initial_health_baseline_ma||item.reference_ma||0),
      agingOffsetMa:Number(item.aging_offset_ma||0),
      normalLowMa:Number(item.normal_low_ma||item.initial_normal_low_ma||0),
      normalHighMa:Number(item.normal_high_ma||item.initial_normal_high_ma||0),
      startupPeakMa:Number(item.startup_peak_ma||0),
      learningSamples:Number(item.learning_samples||0),
      learningComplete:!!item.learning_complete,
      ctValid:(item.ct_valid===undefined)?true:!!item.ct_valid,
      ctDegraded:!!item.ct_degraded,
      adcSaturated:!!item.adc_saturated
    };
  }
  return map;
}
function relayKey(nodeId,ch){return String(nodeId||0)+':'+String(ch);}
function sameNodeId(a,b){return Number(a||0)===Number(b||0);}
function selectedRemoteNode(){return _selNodeId&&!sameNodeId(_selNodeId,_myNodeId);}
function cacheProtection(nodeId,prot){
  const map=normalizeProtection(prot);
  RELAY_PROT_BY_NODE[String(nodeId||0)]=map;
  RELAY_PROT_LAST_MS[String(nodeId||0)]=Date.now();
  return map;
}
async function refreshRemoteProtection(nodeId,force){
  const key=String(nodeId||0);
  if(!force&&RELAY_PROT_LAST_MS[key]&&(Date.now()-RELAY_PROT_LAST_MS[key]<2000)){
    return RELAY_PROT_BY_NODE[key]||{};
  }
  try{
    const prot=await clusterProxyApi(nodeId,'/api/protection');
    return cacheProtection(nodeId,prot);
  }catch(e){
    return RELAY_PROT_BY_NODE[key]||{};
  }
}
function normalizeSchedulerStatus(s){
  return{
    scheduleEnabled:!!(s&&s.schedule_enabled),

async function loadNodeSchedulerStatuses(nodeId,remote){
  const out={};

    const r=(remote&&!isLocal)?await clusterProxyApi(nodeId,'/api/scheduler/summary'):await api('/api/scheduler/summary');

      for(const item of r.channels){

  }catch(e){}

}
function cacheRelayConfig(nodeId,cfg){

  for(const r of relays){

  RELAY_CFG_BY_NODE[String(nodeId||0)]=arr;

}

  return '/api/cluster/node/'+nodeId+String(path||'').replace(/^\/api/,'');

function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function clusterProxyApi(nodeId,path,opts={}){
  if(Number(nodeId||0)===Number(_myNodeId||0)){
    return api(String(path||'/'),opts);
  }
  const p=clusterProxyPath(nodeId,path);
  let last={ok:false,error:'remote_proxy_busy'};
  for(let attempt=0;attempt<12;attempt++){
    let r=await api(p,opts);
    if(r&&r.queued&&r.request_id){
      const retry=Number(r.retry_ms||150);
      for(let i=0;i<60;i++){
        await sleep(retry);
        r=await api('/api/cluster/proxy-result?id='+encodeURIComponent(r.request_id));
        if(!r.pending)return r;
      }
      return{ok:false,error:'remote_proxy_timeout'};
    }
    if(r&&r.error==='remote_proxy_busy'){
      last=r;
      await sleep(150+(attempt*40));
      continue;
    }
    return r;
  }
  return last;
}

      const on=!!((Number(r.relay_mask||0)&bit));

}

  }
  return false;
}

function relayCanControl(nodeId){
  const isLocal=(Number(nodeId)===Number(_myNodeId));
  const hasOtherMaster=CLUSTER_NODES.some(n=>n&&n.online&&Number(n.role)===2&&Number(n.node_id)!==Number(_myNodeId));
  const effectiveMaster=(_myRole===2)&&!hasOtherMaster;
  return effectiveMaster||(_myRole===0&&isLocal);
}
function relayControlButtonHtml(nodeId,ch,on,disabled){
  const key=relayKey(nodeId,ch);
  const dis=disabled?' disabled':'';
  return on?
    '<button class="btn btn-dan" data-relay-key="'+esc(key)+'"'+dis+' onclick="setRelay('+nodeId+','+ch+',0)">關閉</button>':
    '<button class="btn btn-ok" data-relay-key="'+esc(key)+'"'+dis+' onclick="setRelay('+nodeId+','+ch+',1)">開啟</button>';
}
function relayCardHtml(ch,mask,name,locked,adcMa,hasAdc,nodeId,prot,sched){
  const on=!!((mask>>>0)>>>(ch-1)&1),key=relayKey(nodeId,ch),pending=!!RELAY_PENDING[key],baseCls=locked?'locked':(on?'on':'off'),cls=(pending?'pending '+baseCls:baseCls);
  const isLocal=sameNodeId(nodeId,_myNodeId);
  const canControl=relayCanControl(nodeId);
  const dis=(canControl&&!pending)?'':' disabled';
  const title=String(name||'').trim()?esc(name)+' <span class="muted">CH'+ch+'</span>':'CH'+ch;
  const ctReady=!(prot&&prot.ctValid===false);
  const adcDisplay=!ctReady?'CT 未就緒':((adcMa!==null&&adcMa!==undefined&&!Number.isNaN(Number(adcMa)))?(Number(adcMa)+' mA'):(hasAdc?'讀取中...':'無 ADC'));
  let adcText=pending?'等待控制結果...':(locked?'鎖定原因：'+protectionReasonText(prot&&prot.faultReason)+'，'+adcDisplay:adcDisplay);
  if(!ctReady&&prot&&prot.protectionEnabled)adcText='CT 未就緒，電流保護不會啟動';
  let leftBtns='',rightBtns='';

  if(locked){
    if(canControl)leftBtns='<button class="btn btn-dan btn-sm" onclick="unlockRelay('+nodeId+','+ch+')">解鎖</button>';
    else leftBtns='<span class="pill pill-lock">鎖定</span>';
  }else{
    leftBtns=relayControlButtonHtml(nodeId,ch,on,!!dis);
  }
  // Force-stop: local uses protect API, remote sends OFF via cluster
  if(canControl&&isLocal){
    rightBtns='<button class="btn btn-force btn-sm" onclick="forceStopRelay('+nodeId+','+ch+')">強停</button>';
  }else if(canControl){
    rightBtns='<button class="btn btn-force btn-sm" onclick="forceStopRelay('+nodeId+','+ch+')" title="遠端強制停止">強停</button>';
  }
  // Gear: local config or Master firmware cluster proxy.
  if(isLocal){
    rightBtns+='<button class="btn btn-sec btn-sm" onclick="openRelayCfg('+ch+')">設定</button>';
  }else{
    rightBtns+='<button class="btn btn-sec btn-sm" onclick="openRelayCfg('+ch+','+nodeId+')" title="遠端設定">設定</button>';
  }

  return'<div class="relay-card '+cls+'" data-relay-card="'+esc(key)+'" data-node-id="'+esc(nodeId)+'" data-ch="'+ch+'" data-has-adc="'+(hasAdc?1:0)+'" data-locked="'+(locked?1:0)+'">'+
    '<div class="rname">'+title+' <span class="dot '+baseCls+'"></span></div>'+
    '<div class="rstate">'+(pending?'等待中':(locked?'鎖定':(on?'開啟':'關閉')))+'</div>'+
    schedulerChips2(sched,nodeId,ch)+
    '<div class="radc">'+esc(adcText)+'</div>'+
    '<div class="rbtns">'+leftBtns+(rightBtns?'<span style="margin-left:auto;display:flex;gap:4px">'+rightBtns+'</span>':'')+'</div></div>';
}

function relayAdcDisplay(adcMa,hasAdc){
  return(adcMa!==null&&adcMa!==undefined&&!Number.isNaN(Number(adcMa)))?(Number(adcMa)+' mA'):(hasAdc?'讀取中...':'無 ADC');
}
function updateRelayCardLive(nodeId,ch,mask,locked,adcMa,prot){
  const key=relayKey(nodeId,ch),card=document.querySelector('[data-relay-card="'+cssEsc(key)+'"]');
  if(!card)return false;
  const wasLocked=card.dataset.locked==='1';
  const pending=!!RELAY_PENDING[key];
  if(pending)return false;
  const on=!!((Number(mask||0)>>>0)>>>(ch-1)&1),baseCls=locked?'locked':(on?'on':'off');
  if(wasLocked!==!!locked){
    const sched=(RELAY_SCHED_BY_NODE[String(nodeId)]||{})[ch]||null;
    card.outerHTML=relayCardHtml(ch,mask,relayName(nodeId,ch),!!locked,adcMa,card.dataset.hasAdc==='1',nodeId,prot||{},sched);
    return false;
  }
  card.classList.remove('on','off','locked','pending');
  card.classList.add(baseCls);
  card.dataset.locked=locked?'1':'0';
  const dot=card.querySelector('.dot');
  if(dot){dot.classList.remove('on','off','locked');dot.classList.add(baseCls);}
  const st=card.querySelector('.rstate');
  if(st)st.textContent=locked?'鎖定':(on?'開啟':'關閉');
  const btn=card.querySelector('[data-relay-key="'+cssEsc(key)+'"]');
  if(btn&&!locked){
    const canControl=relayCanControl(nodeId);
    btn.disabled=!canControl;
    btn.classList.remove('btn-ok','btn-dan');
    btn.classList.add(on?'btn-dan':'btn-ok');
    btn.textContent=on?'關閉':'開啟';
    btn.setAttribute('onclick','setRelay('+nodeId+','+ch+','+(on?0:1)+')');
  }
  const hasAdc=card.dataset.hasAdc==='1';
  const adcDisplay=relayAdcDisplay(adcMa,hasAdc);
  const adc=card.querySelector('.radc');
  if(adc)adc.textContent=locked?'鎖定原因：'+protectionReasonText(prot&&prot.faultReason)+'，'+adcDisplay:adcDisplay;
  return false;
}
async function refreshDashboardLive(){
  if(!TOKEN||document.hidden||curTab!=='dashboard'||LIVE_REFRESH_BUSY)return;
  LIVE_REFRESH_BUSY=true;
  try{
    let live=null,relay=null,prot=null,clusterNodes=null;
    try{live=await api('/api/dashboard/live');}catch(e){}
    if(live&&live.ok){
      prot={channels:live.protection||live.channels||[]};
      clusterNodes={nodes:live.nodes||[]};
    }else{
      try{relay=await api('/api/relay');}catch(e){}
      try{prot=await api('/api/protection');}catch(e){}
      try{clusterNodes=await api('/api/cluster/nodes');}catch(e){}
    }
    if(document.hidden||curTab!=='dashboard')return;
    const protStatus=normalizeProtection(prot);
    RELAY_PROT_BY_NODE[String(_myNodeId||0)]=protStatus;
    const localMask=live&&live.ok?Number(live.relay_mask||0):(relay?Number(relay.relay_mask||0):0);
    let needFull=false;
    for(let ch=1;ch<=16;ch++){
      const cfg=relayCfg(_myNodeId,ch);
      const hasAdc=(cfg.adc_channel!==undefined&&cfg.adc_channel!==255&&cfg.adc_channel>=0)||
        !!(protStatus[ch]&&(protStatus[ch].protectionEnabled||protStatus[ch].currentMa>0));
      const adcMa=hasAdc&&protStatus[ch]?protStatus[ch].currentMa:null;
      const locked=!!(protStatus[ch]&&protStatus[ch].locked);
      needFull=updateRelayCardLive(_myNodeId,ch,localMask,locked,adcMa,protStatus[ch]||{})||needFull;
    }
    const nodes=(clusterNodes&&clusterNodes.nodes)||[];
    const remoteNodes=nodes.filter(node=>Number(node.node_id)!==Number(_myNodeId)&&node.online);
    for(const node of remoteNodes){
      let remoteProtStatus=RELAY_PROT_BY_NODE[String(node.node_id)]||{};
      try{remoteProtStatus=await refreshRemoteProtection(node.node_id,false);}catch(e){}
      if(document.hidden||curTab!=='dashboard')return;
      const mask=Number(node.relay_mask||0);
      for(let ch=1;ch<=16;ch++){
        const cfg=relayCfg(node.node_id,ch);
        const rprot=remoteProtStatus[ch]||{};
        const locked=!!(rprot.locked||rprot.forceStop);
        const hasAdc=(cfg.adc_channel!==undefined&&cfg.adc_channel!==255&&cfg.adc_channel>=0)||
          !!(rprot.protectionEnabled||rprot.currentMa>0);
        const adcMa=(hasAdc&&rprot.currentMa!==undefined&&rprot.currentMa!==null)?Number(rprot.currentMa):null;
        needFull=updateRelayCardLive(node.node_id,ch,mask,locked,adcMa,rprot)||needFull;
      }
    }
    /* Live polling must not rebuild the whole dashboard.  A full rebuild causes
       visible page reload/flicker after relay actions.  Metadata refresh is now
       only triggered by explicit configuration/scheduler changes. */
  }finally{
    LIVE_REFRESH_BUSY=false;
  }
}

function askControlSchedulerPause(nid,ch){
  return new Promise(resolve=>{
    _controlPauseResolve=resolve;
    const modal=document.getElementById('controlPauseModal');
    const custom=document.getElementById('controlPauseCustom');
    const block=document.getElementById('controlPauseBlockAuto');
    document.getElementById('controlPauseCh').textContent=relayOptionLabel(nid||_myNodeId,ch);
    document.querySelectorAll('input[name="controlPauseMode"]').forEach(r=>{r.checked=(r.value==='segment');});
    if(custom)custom.value='';
    if(block)block.checked=false;
    modal.classList.remove('hidden');
  });
}
function resolveControlPause(ok){
  const modal=document.getElementById('controlPauseModal');
  if(!ok){
    modal.classList.add('hidden');
    if(_controlPauseResolve)_controlPauseResolve(null);
    _controlPauseResolve=null;
    return;
  }
  const mode=(document.querySelector('input[name="controlPauseMode"]:checked')||{}).value||'segment';
  const blockAuto=document.getElementById('controlPauseBlockAuto').checked?1:0;
  let body={pause_mode:0,pause_blocks_auto_trigger:blockAuto};
  if(mode==='1hr'){body.pause_mode=1;body.pause_duration_seconds=3600;}
  else if(mode==='1day'){body.pause_mode=1;body.pause_duration_seconds=86400;}
  else if(mode==='custom'){
    const v=document.getElementById('controlPauseCustom').value;
    if(!v){alert('請選擇暫停到什麼時間');return;}
    body.pause_mode=2;body.pause_until=Math.floor(new Date(v).getTime()/1000);
  }else if(mode==='disable'){
    body.disable_scheduler=1;
  }
  modal.classList.add('hidden');
  if(_controlPauseResolve)_controlPauseResolve(body);
  _controlPauseResolve=null;
}

  return setRelayV2(nid,ch,v);

async function setRelayV2(nid,ch,v){
  const targetNode=nid||_myNodeId;
  if(!relayCanControl(targetNode)){
    alert('Member 不能直接控制 relay，請從 Master 操作。');
    return;
  }

  const sched=await getSchedulerStatusForChannel(targetNode,ch,true);
  let controlBody={target:v,pause_mode:0,pause_blocks_auto_trigger:0};
  if(sched&&sched.scheduleEnabled&&!sched.pauseActive){
    const choice=await askControlSchedulerPause(targetNode,ch);
    if(!choice)return;
    controlBody=Object.assign(controlBody,choice);
  }

  setRelayPending(targetNode,ch,true);
  const isLocal=sameNodeId(targetNode,_myNodeId);
  let r;
  try{
    if(controlBody.disable_scheduler){
      const disableBody={enabled:0};
      if(isLocal)await apiPatch('/api/relay/channels/'+ch+'/scheduler/enabled',disableBody);
      else await clusterProxyApi(targetNode,'/api/relay/channels/'+ch+'/scheduler/enabled',{method:'PATCH',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(disableBody).toString()});
      controlBody.pause_mode=0;
      delete controlBody.disable_scheduler;
      const key=String(targetNode);
      if(RELAY_SCHED_BY_NODE[key]&&RELAY_SCHED_BY_NODE[key][ch])RELAY_SCHED_BY_NODE[key][ch].scheduleEnabled=false;
    }

    if(isLocal)r=await apiPost('/api/relay/channels/'+ch+'/control',controlBody);
    else r=await clusterProxyApi(targetNode,'/api/relay/channels/'+ch+'/control',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(controlBody).toString()});

    if(!r.ok)alert(relayOptionLabel(targetNode,ch)+' 控制失敗: '+(r.error||'unknown'));
    else if(isLocal)await waitRelayState(ch,v);
    else await waitNodeRelayState(targetNode,ch,v);
  }catch(e){
    alert(relayOptionLabel(targetNode,ch)+' 控制失敗: '+(e&&e.message?e.message:'network'));
  }finally{
    setRelayPending(targetNode,ch,false);
    await getSchedulerStatusForChannel(targetNode,ch,true);
    await refreshDashboardLive();
  }
}

}

  const day=SCH.week.ok&&SCH.week.days?SCH.week.days[curEditWd]:null;

  if(curEditIdx>=0)intervals[curEditIdx]={start_minute:sm,end_minute:em};
  else intervals.push({start_minute:sm,end_minute:em});
  intervals.sort((a,b)=>a.start_minute-b.start_minute);
  const b={count:intervals.length};intervals.forEach((iv,i)=>{b['s'+i]=iv.start_minute;b['e'+i]=iv.end_minute;});
  const r=await _schApi('/api/relay/channels/'+curSchCh+'/schedule-week/'+curEditWd,{method:'PUT',body:b});
  if(r.ok){closeModal('schEditModal');loadScheduler();}
  else if(r.error==='SCHEDULE_OVERLAP')alert('排程區間重疊，請檢查時間設定');
  else alert('失敗: '+(r.error||''));
}

// Route scheduler action to local or remote node
async function _schApi(path, opts){
  if(selectedRemoteNode()){
    return clusterProxyApi(_selNodeId,path,{method:opts.method||'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(opts.body||{}).toString()});
  }
  if(opts.method==='PATCH')return apiPatch(path,opts.body||{});
  if(opts.method==='PUT')return api(path,{method:'PUT',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(opts.body||{}).toString()});
  return apiPost(path,opts.body||{});
}

async function doPause(){
  const mode=document.querySelector('input[name="pauseMode"]:checked').value;
  const blockAuto=document.getElementById('pauseBlockAuto').checked?1:0;
  let body={pause_blocks_auto_trigger:blockAuto};
  if(mode==='segment'){body.mode=0;}
  else if(mode==='1hr'){body.mode=1;body.duration_seconds=3600;}
  else if(mode==='1day'){body.mode=1;body.duration_seconds=86400;}
  else if(mode==='custom'){const v=document.getElementById('pauseCustom').value;if(!v)return alert('請選擇暫停到什麼時間');body.mode=2;body.until=Math.floor(new Date(v).getTime()/1000);}
  else if(mode==='forever'||mode==='disable'){
    const r=await _schApi('/api/relay/channels/'+_pauseCh+'/scheduler/enabled',{method:'PATCH',body:{enabled:0}});
    if(r.ok){closeModal('pauseModal');loadScheduler();}else alert('停用失敗: '+(r.error||''));
    return;
  }
  const r=await _schApi('/api/relay/channels/'+_pauseCh+'/scheduler/pause',{method:'POST',body});
  if(r.ok){closeModal('pauseModal');loadScheduler();}else alert('失敗: '+(r.error||''));
}

        '<br><span style="'+(cfg.protection_enabled?'':'opacity:.45')+'">手動門檻 '+esc(cfg.overcurrent_milliamps||0)+' mA<br>跳脫延遲 '+esc(cfg.trip_delay_ms||0)+' ms<br>回差 '+esc(cfg.reset_hysteresis_milliamps||0)+' mA</span></div></td>'+
      '<td data-label="學習資訊">'+learnedInfoHtml(s)+'</td>'+
      '<td data-label="操作" class="row">'+(locked||forced?'<button class="btn btn-ok btn-sm" onclick="unlockProt('+ch+')">解鎖</button> ':'')+
        '<button class="btn btn-sec btn-sm" onclick="openRelayCfg('+ch+','+targetNode+')">設定</button> '+
        '<button class="btn btn-dan btn-sm" onclick="forceProtStop('+ch+')">強制停止</button> '+
        '<button class="btn btn-sec btn-sm" onclick="clearLearn('+ch+')">清除學習</button> '+
        '<button class="btn btn-sec btn-sm" '+(cfg.protection_enabled?'':'disabled title="未啟用電流保護策略"')+' onclick="setStrategy('+ch+')">切換策略</button></td></tr>';
  }
  h+='</tbody></table></div></div>';
  document.getElementById('main').innerHTML=h;
}

async function loadSettings(){
  let scfg=null,sstatus=null;
  try{scfg=await api('/api/config/cluster');}catch(e){}
  try{sstatus=await api('/api/status');}catch(e){}
  const devName=(scfg&&scfg.device_name)||DEFAULT_DEVICE_NAME;
  const clusterName=(scfg&&scfg.cluster_name)||DEFAULT_CLUSTER_NAME;
  const brokerHost=(scfg&&scfg.cloud_broker_host)||DEFAULT_BROKER_HOST;
  const brokerPort=(scfg&&scfg.cloud_broker_port)||DEFAULT_BROKER_PORT;
  const cloudDeviceId=(scfg&&scfg.cloud_device_id)||'';
  let h='<div class="card"><h2>裝置與叢集設定</h2>'+
    '<div class="settings-row"><div><label>裝置名稱</label><input id="setDevName" value="'+esc(devName)+'"></div>'+
    '<button class="btn btn-pri" onclick="saveSetting(\'device_name\',\'setDevName\')">保存</button></div>'+
    '<div class="settings-row"><div><label>叢集名稱 '+infoTip('同一區域網內，名稱相同且叢集密碼相同的 MCU 才會互相發現與選主。若同一網路有多個獨立系統，請使用不同叢集名稱與叢集密碼。')+'</label><input id="setClName" value="'+esc(clusterName)+'"></div>'+
    '<button class="btn btn-pri" onclick="saveSetting(\'cluster_name\',\'setClName\')">保存</button></div>'+
    '<div class="settings-row"><div><label>Broker Host</label><input id="setBroker" value="'+esc(brokerHost)+'"></div>'+
    '<button class="btn btn-pri" onclick="saveSetting(\'cloud_broker_host\',\'setBroker\')">保存</button></div>'+
    '<div class="settings-row"><div><label>Broker Port</label><input id="setBPort" type="number" value="'+esc(brokerPort)+'"></div>'+
    '<button class="btn btn-pri" onclick="saveSetting(\'cloud_broker_port\',\'setBPort\')">保存</button></div>'+
    '<div class="settings-row"><label class="checkline"><input id="setBackendConn" type="checkbox" '+((scfg&&scfg.cloud_enabled)?'checked':'')+'> 啟用後端連線</label>'+
    '<button class="btn btn-pri" onclick="saveSettingChecked(\'cloud_enabled\',\'setBackendConn\')">保存</button></div>'+
    '<div style="margin-bottom:8px"><label>Cloud Device ID（後端認領此 ID）</label><input value="'+esc(cloudDeviceId)+'" disabled></div>'+
    '<div class="hint">如需連接後端，請在後端管理台新增並認領上方 Cloud Device ID。</div>'+
    '</div>';

  h+='<div class="card"><h2>變更本機登入密碼</h2>'+
    '<div class="msg msg-info">此密碼只用於登入這台 MCU 的本機 Web，不會作為叢集信任密碼。</div>'+
    '<div class="mini-grid">'+
    '<div><label>目前密碼</label><input id="setPwdOld" type="password" autocomplete="current-password"></div>'+
    '<div><label>新密碼</label><input id="setPwdNew" type="password" autocomplete="new-password"></div>'+
    '<div><label>確認新密碼</label><input id="setPwdNew2" type="password" autocomplete="new-password"></div>'+
    '</div><div class="row" style="margin-top:10px"><button class="btn btn-pri" onclick="changePassword()">變更本機登入密碼</button><span id="pwdMsg" class="hint"></span></div></div>';

  h+='<div class="card"><h2>變更本地叢集密碼</h2>'+
    '<div class="msg msg-info">'+
    ((scfg&&scfg.cluster_password_default)?'目前使用燒錄預設叢集密碼，建議修改。':'此密碼只用於 LAN 內 MCU 互相信任、Master 對 Member 代理控制與叢集設定同步。')+
    '</div>'+
    '<div class="mini-grid">'+
    '<div><label>目前本機登入密碼</label><input id="setClusterPwdAuth" type="password" autocomplete="current-password"></div>'+
    '<div><label>新叢集密碼</label><input id="setClusterPwdNew" type="password" autocomplete="new-password"></div>'+
    '<div><label>確認新叢集密碼</label><input id="setClusterPwdNew2" type="password" autocomplete="new-password"></div>'+
    '</div><div class="row" style="margin-top:10px"><button class="btn btn-pri" onclick="changeClusterPassword()">變更本地叢集密碼</button><span id="clusterPwdMsg" class="hint"></span></div></div>';

  h+='<div class="card"><h2>系統資訊</h2><div style="font-size:1rem;line-height:2.2">'+
    '<div>版本: <b>'+esc(DEV.version||'--')+'</b></div>'+
    '<div>RTC 時間: <b>'+new Date((DEV.unixTime||0)*1000).toLocaleString()+'</b></div>'+
    '<div>運行時間: <b>'+esc(Math.floor((DEV.uptimeMs||0)/1000))+' s</b></div>'+
    '<div>FreeRTOS Heap: <b>'+esc(DEV.heapFree||'--')+' bytes</b></div></div>';

  h+='<div class="card"><button class="btn btn-dan" onclick="doLogout()">登出</button></div>';
  document.getElementById('main').innerHTML=h;
}
async function saveSetting(field,inputId){
  const v=document.getElementById(inputId).value;
  const b={};b[field]=v;
  const r=await apiPost('/api/config/cluster',b);
  alert(r.ok?'已保存':'失敗: '+(r.error||''));
}
async function saveSettingChecked(field,inputId){
  const v=document.getElementById(inputId).checked?'1':'0';
  const b={};b[field]=v;
  const r=await apiPost('/api/config/cluster',b);
  alert(r.ok?'已保存':'失敗: '+(r.error||''));
}
async function changePassword(){
  const oldPwd=document.getElementById('setPwdOld').value;
  const newPwd=document.getElementById('setPwdNew').value;
  const newPwd2=document.getElementById('setPwdNew2').value;
  const msg=document.getElementById('pwdMsg');
  if(!oldPwd)return msg.textContent='請輸入目前密碼';
  if(!newPwd||newPwd.length<4)return msg.textContent='新密碼至少 4 個字元';
  if(newPwd!==newPwd2)return msg.textContent='兩次新密碼不一致';
  const r=await apiPost('/api/config/password',{current_password:oldPwd,new_password:newPwd});
  if(!r||!r.ok){msg.textContent='變更失敗: '+((r&&r.error)||'unknown');return;}
  msg.textContent='密碼已變更，請重新登入';
  TOKEN='';
  setTimeout(()=>{doLogout();},800);
}
async function changeClusterPassword(){
  const authPwd=document.getElementById('setClusterPwdAuth').value;
  const newPwd=document.getElementById('setClusterPwdNew').value;
  const newPwd2=document.getElementById('setClusterPwdNew2').value;
  const msg=document.getElementById('clusterPwdMsg');
  if(!authPwd)return msg.textContent='請輸入目前本機登入密碼';
  if(!newPwd||newPwd.length<8)return msg.textContent='新叢集密碼至少 8 個字元';
  if(newPwd!==newPwd2)return msg.textContent='兩次新叢集密碼不一致';
  const r=await apiPost('/api/config/cluster-password',{current_password:authPwd,new_cluster_password:newPwd});
  if(!r||!r.ok){msg.textContent='變更失敗: '+((r&&r.error)||'unknown');return;}
  msg.textContent='叢集密碼已變更。其他成員需使用相同叢集密碼才會互相信任。';
}
async function doLogout(){await api('/api/logout',{method:'POST'});TOKEN='';RELAYS={};SCH={};NODES=[];document.getElementById('main').innerHTML='';document.getElementById('loginModal').classList.remove('hidden');}

document.querySelectorAll('.modal').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)m.classList.add('hidden');});});

checkLogin();refreshAll();

// Live relay refresh keeps card color/current correct even when no button is pressed.
// Full refresh stays slower because it reloads config/scheduler metadata.
setInterval(()=>{if(!document.hidden)refreshDashboardLive();},LIVE_REFRESH_MS);
setInterval(()=>{if(!document.hidden&&curTab!=='dashboard')refreshAll();},30000);
setInterval(()=>{if(!document.hidden)updateDeviceClock();},1000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(curTab==='dashboard')refreshDashboardLive();
  else refreshAll();
});
</script>
